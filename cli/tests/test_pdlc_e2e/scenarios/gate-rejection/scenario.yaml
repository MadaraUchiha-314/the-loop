# Error case: a malformed artifact fails the phase gate rather than silently
# advancing. The requirements are emitted with the gated `## Security
# considerations` section MISSING; the completion claim blocks, the label does
# not move, and only the repaired artifact advances the run. (The artifact is
# never `status: approved` here — locking is the approval gate's act, not the
# producing node's, issue-281 — so the run ends parked at
# `requirements-approval` with the artifact still a draft.)
name: gate-rejection
description: a malformed artifact blocks its phase gate; the repaired artifact advances
tier: 3
workItem: issue-11
steps:
  - comment:
      author: owner
      body: |
        the-loop execute

        - [ ] brainstorming
  - emit: {artifact: requirements.md, fixture: requirements-malformed.md}
  - complete: {node: requirements-definition, status: block}
  - expect:
      currentNode: requirements-definition
      parked: false
      labels:
        - "loop:phase-selection"
        - "loop:requirements-definition"
      events:
        - {event: graph.blocked, node: requirements-definition, hook: validate-artifacts}
  - emit: {artifact: requirements.md, fixture: requirements.md}
  - complete: {node: requirements-definition}
expect:
  finalNode: requirements-approval
  completed: false
  nodes:
    - phase-selection
    - brainstorming~
    - requirements-definition
    - requirements-approval
  labels:
    - "loop:phase-selection"
    - "loop:requirements-definition"
  events:
    - {event: graph.blocked, node: requirements-definition, hook: validate-artifacts}
    - {event: graph.advanced, node: requirements-definition, to: requirements-approval, outcome: pass}
