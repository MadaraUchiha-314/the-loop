# The Slack app the-loop's channel needs — Slack's own app-manifest format
# (https://api.slack.com/reference/manifests). Import it once: api.slack.com/apps
# → Create New App → From a manifest → paste this file. Print it with
# `the-loop channels manifest`. After the import, mint the app-level token
# (Basic Information → App-Level Tokens, scope connections:write) for Socket Mode
# and install the app to the workspace for the bot token; export both under the
# names channels.slack.botTokenEnv / appTokenEnv name. (issue-334)
display_information:
  name: the-loop
  description: Drive the-loop from Slack — one thread per work item, a slash command for the rest.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: the-loop
    always_online: false
  slash_commands:
    - command: /the-loop
      description: "Drive the-loop: start a work item, check the instance, standing sessions"
      usage_hint: "help | start #123 | status | upgrade | standing start <name>"
      should_escape: false
  # The two acts a room asks for, from a message's ⋯ menu (issue-389): each is
  # exactly the typed mention — `@the-loop record-context` on that message's
  # thread, `@the-loop record-decision` through a modal — under the same
  # allow-list and the same grants. Delivered over Socket Mode like a button.
  shortcuts:
    - name: Add as the-loop context
      type: message
      callback_id: "the-loop:record-context"
      description: Snapshot this thread onto the work item as context
    - name: Record the-loop decision
      type: message
      callback_id: "the-loop:record-decision"
      description: Record what this message decided, with a kind and a rationale
oauth_config:
  scopes:
    bot:
      - chat:write          # post into the channel and its threads
      - channels:history    # read thread replies and kickoffs in a public channel
      - groups:history      # the same in a private channel
      - im:history          # the same in a direct message with the bot (issue-362)
      - mpim:history        # the same in a group direct message (issue-362)
      - reactions:write     # acknowledge an accepted message on itself (issue-325)
      - commands            # the /the-loop slash command (issue-334)
      # Name resolution (issue-375): a person types #tmp-issue-375 and @dana;
      # Slack's API takes C0123ABCD and U0456GHIJ. These three scopes are READ
      # ONLY and are what turns one into the other — for channels.slack.channel,
      # for `the-loop add-channel`, and for routing.authorizedUsers[].slack.
      # Without them the-loop still works; it just needs ids everywhere.
      - channels:read       # resolve a PUBLIC channel name to its id
      - groups:read         # the same for a private channel the bot is in
      - users:read          # resolve @handle to a member id
      # The mention is the address (issue-389): a message meant for the-loop
      # carries @the-loop and arrives as the app_mention event; a message.*
      # event is input only in a DM with the bot or in a room an authorized
      # user switched to `--listen all`.
      - app_mentions:read   # hear @the-loop in any channel the bot is in
      # A screenshot or a voice note on a message (issue-416): READ ONLY, and
      # what lets the-loop fetch a file the bot can already see — the image for
      # the session to read, the captions Slack itself produced for a voice
      # clip. Without it a file is named and linked, never fetched.
      - files:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels    # a public channel
      - message.groups      # a private channel
      - message.im          # a direct message with the bot (issue-362)
      - message.mpim        # a group direct message (issue-362)
      - app_mention         # @the-loop, in any of them (issue-389)
  interactivity:
    is_enabled: true        # Approve / Request changes, Execute / Start buttons (read.mode: socket)
  org_deploy_enabled: false
  socket_mode_enabled: true # `the-loop channels listen` — an outbound connection, nothing exposed
  token_rotation_enabled: false
