# the-loop's product-development lifecycle, as an explicit graph (issue-109) —
# the OUTER of the two loops (issue-172): pdlc-work-item-loop walks a WORK ITEM
# through the PDLC, and pdlc-pr-loop (its sibling file) walks each PULL REQUEST
# delivering it through the component-scoped subset. They meet at one seam: the
# `implementation` node here waits for every started inner loop to finish
# (`await-inner-loops`) before the work item moves on to verification across
# all the PRs. A work item with no inner loops — one agent, one session, the
# whole pre-issue-172 world — passes that gate vacuously and behaves exactly as
# before. (pdlc-project-management-loop is anticipated by the naming and not
# yet shipped.)
#
# This file ships WITH THE PLUGIN and is the-loop's own. A repository cannot
# define or override it — a repo-supplied graph is ignored with a warning.
# It is fully declarative precisely so user-authored graphs can arrive later as
# a distribution change rather than a rewrite.
#
# A node is a step: a place the work item IS. It has entry and exit hook chains.
# A node is complete when its exit hooks all pass, waiting when one returns
# `wait`, blocked when one returns `block`. No prose is ever parsed.
#
# Note the six nodes between `implementation` and `complete`. They were all one
# `needs-review` label before this graph existed — which is exactly where the
# measured drift piled up (23 of 26 execution logs stopped there).
#
# `test-planning` and `verification` (issue-163) are the same argument applied to
# testing: how a work item will be proved is planned before the task DAG that
# references it, and the plan is executed at a node of its own rather than being
# asserted in prose at review time.
#
# Spec: docs/specs/issue-109/, docs/specs/issue-163/  ·  Decisions: 041, 042, 060

version: 1
name: pdlc-work-item-loop
start: brainstorming

nodes:
  - id: brainstorming
    phase: brainstorming
    actor: agent
    optional: true          # a work item whose scope is already clear skips it
    produces: [brainstorm.md]
    command: brainstorm
    stage: brainstorm
    entry: [set-phase-label, log-entry]
    exit:
      - {hook: validate-artifacts, with: {locked: true, sections: ["Problem / opportunity", "Open questions"]}}
      - lint-artifacts

  - id: requirements-definition
    phase: requirements-definition
    actor: agent
    # One artifact, two accepted names: a bug's phase-1 spec is called bugfix.md,
    # and the skill, the workflow reference, the manifest and a bundled template
    # have all said so since before this graph existed. Exactly one of them may be
    # present — two would leave the gate with no defined source of truth
    # (issue-124, decision-045).
    produces: ["requirements.md|bugfix.md"]
    command: new-requirement
    stage: requirements
    entry: [set-phase-label, log-entry]
    exit:
      - {hook: validate-artifacts, with: {locked: true, sections: ["Requirements", "Security considerations"]}}
      - lint-artifacts

  - id: requirements-approval
    actor: human
    session: inherit
    entry: [set-phase-label, request-review, {hook: notify, with: {event: phase-approval-pending}}]
    exit:
      - classify-feedback
      - {hook: record-feedback, with: {into: requirements.md}}

  - id: design
    phase: design
    actor: agent
    produces: [design.md]
    command: create-design
    stage: design
    entry: [set-phase-label, log-entry]
    exit:
      - {hook: validate-artifacts, with: {locked: true, sections: ["Architecture", "Security design", "Testing strategy"]}}
      # Same two names as phase 1. Naming only requirements.md here meant this
      # check resolved to nothing for every bug, skipped, and passed the chain —
      # a security gate reporting success without running (issue-124).
      - {hook: enforces-boundaries-from, with: {upstream: "requirements.md|bugfix.md", markers: ["trust boundary", "abuse case"]}}
      - lint-artifacts

  # Planning HOW the work item will be proved. It sits between `design` and
  # `design-approval` on purpose (owner's call on PR #166): the plan is derived
  # from the design and reviewed WITH it, so one human gate approves both rather
  # than the plan getting a stop of its own — and it is still locked before the
  # task DAG that references it, since each task's `_Test:_` names a row of the
  # matrix (issue-163, decision-060).
  #
  # `Verification results` is gated here too — `validate-artifacts` treats an
  # empty required section as a finding, so the heading is authored up front
  # holding "not yet executed", and the `verification` node fills a section
  # rather than inventing one.
  - id: test-planning
    phase: test-planning
    actor: agent
    produces: [testing-plan.md]
    command: create-testing-plan
    stage: test-planning
    entry: [set-phase-label, log-entry]
    exit:
      - hook: validate-artifacts
        with:
          locked: true
          sections:
            - Test matrix
            - Verification environment
            - Evidence plan
            - Verification results
      - lint-artifacts

  # One gate, two artifacts: `design.md` and the `testing-plan.md` derived from
  # it. Feedback is recorded into BOTH, because a reviewer's note about the test
  # matrix belongs in the plan, not filed under the design — the whole point of
  # record-feedback is that feedback travels with the document it concerns.
  - id: design-approval
    actor: human
    session: inherit
    entry: [set-phase-label, request-review, {hook: notify, with: {event: phase-approval-pending}}]
    exit:
      - classify-feedback
      - {hook: record-feedback, with: {into: design.md}}
      - {hook: record-feedback, with: {into: testing-plan.md}}

  - id: tasks-breakdown
    phase: tasks-breakdown
    actor: agent
    produces: [tasks.md]
    command: create-tasks-plan
    stage: tasks
    entry: [set-phase-label, log-entry]
    exit:
      - {hook: validate-artifacts, with: {locked: true, sections: ["Task list"]}}
      - lint-artifacts

  - id: implementation
    phase: implementation
    actor: agent
    produces: [tasks.md]
    command: execute-tasks
    stage: implementation
    entry: [set-phase-label, log-entry]
    exit:
      - {hook: validate-artifacts, with: {checkmarks: complete}}
      # The seam between the loops (issue-172): the work item waits here until
      # every started pdlc-pr-loop under docs/specs/<id>/pr-loops/ reaches its
      # `complete` node — "wait for tasks to be complete (inner loop start and
      # finish)". No inner loops started = vacuous pass, the pre-issue-172
      # behaviour for single-session work items.
      - await-inner-loops
      - verify-tests

  # Executing the plan the `test-planning` node locked. It re-declares the SAME
  # artifact — the shape `implementation` already uses for `tasks.md` — because
  # `validate-artifacts` returns *skipped* for a node that declares none, and a
  # gate that reports success without running is the issue-124 failure mode.
  # It sits before the review chain so a failed verification is visible to the
  # reviewers rather than discovered after them (issue-163).
  - id: verification
    phase: verification
    actor: agent
    produces: [testing-plan.md]
    command: verify-work
    stage: verification
    entry: [set-phase-label, log-entry]
    exit:
      - hook: validate-artifacts
        with:
          checkmarks: complete
          sections: [Verification results]
      # No-op unless a graph revision binds a command, exactly as on
      # `implementation`: the obvious seam for a project's own verification entry
      # point, without the-loop owning a runner.
      - verify-tests

  # --- everything below was ONE `needs-review` label before this graph -------
  #
  # These six do not *author* an artifact — each owns one section of the SHARED
  # `execution-log.md`. So they declare `validates:` rather than `produces:`,
  # which keeps "produces" meaning "this node wrote it" while still giving each
  # gate a file to read (issue-167, decision-063).
  #
  # Without it they declared no artifact at all, so `validate-artifacts` returned
  # *skipped* on every run and — a skip not being a decision (decision-060) — the
  # chain passed straight through all six, `security-review` included, however
  # empty the log was. `locked:` is deliberately absent: the execution log is
  # append-only and carries `status: in-progress | complete`, never `approved`.

  - id: self-review
    phase: needs-review
    actor: agent
    stage: self-review
    entry: [set-phase-label, log-entry]
    exit:
      - {hook: validate-artifacts, with: {validates: execution-log.md, sections: ["Review cycles"]}}

  - id: critic-review
    actor: agent
    stage: critic-review
    entry: [log-entry]
    exit:
      - {hook: validate-artifacts, with: {validates: execution-log.md, sections: ["Review cycles"]}}

  - id: security-review
    actor: agent
    required: true          # never skippable, at any risk tier
    stage: security-review
    entry: [log-entry]
    exit:
      - {hook: validate-artifacts, with: {validates: execution-log.md, sections: ["Security review (gate)"]}}

  - id: evidence
    actor: agent
    stage: evidence
    entry: [log-entry]
    exit:
      - {hook: validate-artifacts, with: {validates: execution-log.md, sections: ["Final validation evidence"]}}

  - id: capability-docs
    actor: agent
    stage: capability-docs
    entry: [log-entry]
    exit:
      - {hook: validate-artifacts, with: {validates: execution-log.md, sections: ["Capability docs"]}}

  - id: reviewer-briefing
    actor: agent
    stage: reviewer-briefing
    entry: [log-entry]
    exit:
      - {hook: validate-artifacts, with: {validates: execution-log.md, sections: ["Pull requests"]}}

  - id: human-approval
    actor: human
    session: inherit
    required: true          # the tier-4 gate; bypassable only by an audited force
    entry: [set-phase-label, request-review, {hook: notify, with: {event: pr-review-pending}}]
    exit: [classify-feedback]

  - id: complete
    phase: complete
    actor: agent
    command: finish-tasks
    stage: complete
    terminal: true
    entry: [set-phase-label, log-entry]
    exit: []

  - id: escalated
    actor: human
    terminal: true
    entry: [{hook: notify, with: {event: conflict-escalated}}]
    exit: []

edges:
  - {from: brainstorming, to: requirements-definition, on: pass}
  - {from: requirements-definition, to: requirements-approval, on: pass}
  - {from: requirements-approval, to: design, on: approved}
  - {from: requirements-approval, to: design, on: approved-with-comments}
  - {from: requirements-approval, to: requirements-definition, on: changes-requested}
  - {from: design, to: test-planning, on: pass}
  - {from: test-planning, to: design-approval, on: pass}
  - {from: design-approval, to: tasks-breakdown, on: approved}
  - {from: design-approval, to: tasks-breakdown, on: approved-with-comments}
  # Back to `design`, not to `test-planning`: the plan is derived from the design,
  # so a change to the design re-derives the plan on the way back through.
  - {from: design-approval, to: design, on: changes-requested}
  - {from: tasks-breakdown, to: implementation, on: pass}
  - {from: implementation, to: verification, on: pass}
  - {from: verification, to: self-review, on: pass}
  - {from: self-review, to: critic-review, on: pass}
  - {from: critic-review, to: security-review, on: pass}
  - {from: security-review, to: evidence, on: pass}
  - {from: evidence, to: capability-docs, on: pass}
  - {from: capability-docs, to: reviewer-briefing, on: pass}
  - {from: reviewer-briefing, to: human-approval, on: pass}
  - {from: human-approval, to: complete, on: approved}
  - {from: human-approval, to: complete, on: approved-with-comments}
  - {from: human-approval, to: implementation, on: changes-requested}
