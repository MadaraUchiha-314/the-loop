# the-loop's product-development lifecycle, as an explicit graph (issue-109) —
# the OUTER of the two loops (issue-172): pdlc-work-item-loop walks a WORK ITEM
# through the PDLC, and pdlc-pr-loop (its sibling file) walks each PULL REQUEST
# delivering it through the component-scoped subset. They meet at one seam: the
# `implementation` node here waits for every started inner loop to finish
# (`await-inner-loops`) before the work item moves on to verification across
# all the PRs. A work item with no inner loops — one agent, one session, the
# whole pre-issue-172 world — passes that gate vacuously and behaves exactly as
# before. (pdlc-project-management-loop is anticipated by the naming and not
# yet shipped.)
#
# WHERE each loop runs (issue-183): this one runs in the repository the TICKET
# was created in — the origin repository — and that is where the work item's one
# spec chain lives. Each contributing repository gets ONE pull request walking
# pdlc-pr-loop, with its state under this spec directory qualified by repository
# (pr-loops/<owner>__<repo>/pr-<n>/). A work item may declare those repositories
# in execution-log.md's front matter (`repos:`), and `await-inner-loops` then
# holds `implementation` until each of them has a loop — a contribution that was
# planned and never opened is otherwise indistinguishable from one that was
# never needed. Where THIS loop's artifacts are iterated with humans is the
# project's declaration, `workflow.outerLoop.surface` (issue-183,
# decision-069); the inner loop has no such setting.
#
# This file ships WITH THE PLUGIN and is the-loop's own. A repository cannot
# define or override it — a repo-supplied graph is ignored with a warning.
# It is fully declarative precisely so user-authored graphs can arrive later as
# a distribution change rather than a rewrite.
#
# A node is a step: a place the work item IS. It has entry and exit hook chains.
# A node is complete when its exit hooks all pass, waiting when one returns
# `wait`, blocked when one returns `block`. No prose is ever parsed.
#
# Note the six nodes between `implementation` and `complete`. They were all one
# `needs-review` label before this graph existed — which is exactly where the
# measured drift piled up (23 of 26 execution logs stopped there).
#
# `test-planning` and `verification` (issue-163) are the same argument applied to
# testing: how a work item will be proved is planned before the task DAG that
# references it, and the plan is executed at a node of its own rather than being
# asserted in prose at review time.
#
# Spec: docs/specs/issue-109/, docs/specs/issue-163/  ·  Decisions: 041, 042, 060

version: 1
name: pdlc-work-item-loop
start: phase-selection

# Declared skips (issue-177): `skippable: true` is the FIXED vocabulary of
# nodes a HUMAN may declare skipped for one work item. The selection happens at
# the loop's own FIRST phase (`phase-selection`): the-loop posts a checklist of
# these phases on the ticket, an authorized user replies with the ones this item
# needs plus `the-loop execute`, and only then does the loop start walking.
# `the-loop graph skip` is the same declaration from an operator's shell.
# The harness never declares a skip. A declared skip routes the pointer along
# the node's `on: skipped` edge and is reported as *skipped by declaration*,
# never as a pass.
#
# issue-179 (the owner's call on the ticket) widened that vocabulary to EVERY
# phase this loop walks. issue-177 had kept a protected floor — test-planning,
# implementation, verification, the review chain, security-review,
# human-approval — on the argument that a fixed floor bounds the damage of an
# illegitimate declaration. That floor is gone, and ONE structural invariant
# replaced it:
#
#   `phase-selection` is `required: true` and carries no marker, so no
#   declaration from any channel can route around the act of choosing.
#
# The loop therefore cannot start without a named, authorized human saying which
# phases it walks — and every phase that does not run is attributable to that
# person, before the fact, with provenance in graph-state.json, in the frozen
# graph of the portable record, in a confirmation comment on the ticket, and in
# every `the-loop check` thereafter. The guarantee moved from "these phases
# always ran" to "every phase that did not run has a name on it". Read
# decision-068 before narrowing or widening this list; the residual it accepts
# is stated there in full.
skipSets:
  # One token for the motivating case (a doc fix): `--node spec-chain`. It names
  # the chain the project's own vocabulary describes — requirements → design →
  # testing-plan → tasks — so `test-planning` belongs in it (issue-179).
  spec-chain:
    - brainstorming
    - requirements-definition
    - requirements-approval
    - design
    - test-planning
    - design-approval
    - tasks-breakdown
  # The six nodes that were one `needs-review` label. One token for the other
  # end of the walk, so declaring it away is as deliberate — and as visible —
  # as declaring the spec chain away (issue-179).
  review-chain:
    - self-review
    - critic-review
    - security-review
    - evidence
    - capability-docs
    - reviewer-briefing

nodes:
  # The work item's own first phase (issue-177, owner's call on PR #178): before
  # any phase runs, the-loop asks the ticket which phases this item needs and
  # waits for an authorized user's reply plus `the-loop execute`. A human node,
  # like every other point where a person decides something — and deliberately
  # NOT a label: a label rides GitHub's permission model rather than the loop's
  # own `authorizedUsers`, and has to be created in every consuming repo first.
  - id: phase-selection
    phase: phase-selection
    actor: human
    required: true          # the selection is a human act; never skippable
    entry: [set-phase-label, log-entry, post-phase-selection, deliver-assignment]
    exit: [classify-phase-selection]

  - id: brainstorming
    phase: brainstorming
    actor: agent
    optional: true          # a work item whose scope is already clear skips it
    skippable: true         # and its author may declare that up front (issue-177)
    produces: [brainstorm.md]
    command: brainstorm
    stage: brainstorm
    entry: [set-phase-label, log-entry, deliver-assignment]
    exit:
      - {hook: validate-artifacts, with: {locked: true, sections: ["Problem / opportunity", "Open questions"]}}
      - lint-artifacts

  - id: requirements-definition
    phase: requirements-definition
    actor: agent
    skippable: true         # issue-177: the author may declare it, the harness never
    # One artifact, two accepted names: a bug's phase-1 spec is called bugfix.md,
    # and the skill, the workflow reference, the manifest and a bundled template
    # have all said so since before this graph existed. Exactly one of them may be
    # present — two would leave the gate with no defined source of truth
    # (issue-124, decision-045).
    produces: ["requirements.md|bugfix.md"]
    command: new-requirement
    stage: requirements
    entry: [set-phase-label, log-entry, deliver-assignment]
    exit:
      - {hook: validate-artifacts, with: {locked: true, sections: ["Requirements", "Security considerations"]}}
      - lint-artifacts

  - id: requirements-approval
    actor: human
    session: inherit
    skippable: true         # nothing to approve when phase 1 is declared away;
                            # skipped alone, the artifact still meets the final
                            # human-approval gate in the PR (issue-177)
    entry: [set-phase-label, request-review, {hook: notify, with: {event: phase-approval-pending}}]
    exit:
      - classify-feedback
      - {hook: record-feedback, with: {into: requirements.md}}

  - id: design
    phase: design
    actor: agent
    skippable: true         # issue-177
    produces: [design.md]
    command: create-design
    stage: design
    entry: [set-phase-label, log-entry, deliver-assignment]
    exit:
      - {hook: validate-artifacts, with: {locked: true, sections: ["Architecture", "Security design", "Testing strategy"]}}
      # Same two names as phase 1. Naming only requirements.md here meant this
      # check resolved to nothing for every bug, skipped, and passed the chain —
      # a security gate reporting success without running (issue-124).
      - {hook: enforces-boundaries-from, with: {upstream: "requirements.md|bugfix.md", markers: ["trust boundary", "abuse case"]}}
      - lint-artifacts

  # Planning HOW the work item will be proved. It sits between `design` and
  # `design-approval` on purpose (owner's call on PR #166): the plan is derived
  # from the design and reviewed WITH it, so one human gate approves both rather
  # than the plan getting a stop of its own — and it is still locked before the
  # task DAG that references it, since each task's `_Test:_` names a row of the
  # matrix (issue-163, decision-060).
  #
  # `Verification results` is gated here too — `validate-artifacts` treats an
  # empty required section as a finding, so the heading is authored up front
  # holding "not yet executed", and the `verification` node fills a section
  # rather than inventing one.
  - id: test-planning
    phase: test-planning
    actor: agent
    skippable: true         # issue-179, the ticket's own ask: a documentation
                            # fix has no matrix worth locking. Skipping it does
                            # not remove the proof — `verification` below moves
                            # its subject to the execution log rather than
                            # losing it.
    produces: [testing-plan.md]
    command: create-testing-plan
    stage: test-planning
    entry: [set-phase-label, log-entry, deliver-assignment]
    exit:
      - hook: validate-artifacts
        with:
          locked: true
          sections:
            - Test matrix
            - Verification environment
            - Evidence plan
            - Verification results
      - lint-artifacts

  # One gate, two artifacts: `design.md` and the `testing-plan.md` derived from
  # it. Feedback is recorded into BOTH, because a reviewer's note about the test
  # matrix belongs in the plan, not filed under the design — the whole point of
  # record-feedback is that feedback travels with the document it concerns.
  - id: design-approval
    actor: human
    session: inherit
    skippable: true         # issue-177: with design skipped this gate has only
                            # the testing plan to read, and that plan still gets
                            # its human eyes at `human-approval`
    entry: [set-phase-label, request-review, {hook: notify, with: {event: phase-approval-pending}}]
    exit:
      - classify-feedback
      - {hook: record-feedback, with: {into: design.md}}
      - {hook: record-feedback, with: {into: testing-plan.md}}

  - id: tasks-breakdown
    phase: tasks-breakdown
    actor: agent
    skippable: true         # issue-177: `implementation` re-gates tasks.md and
                            # treats this declared absence as planned
    produces: [tasks.md]
    command: create-tasks-plan
    stage: tasks
    entry: [set-phase-label, log-entry, deliver-assignment]
    exit:
      - {hook: validate-artifacts, with: {locked: true, sections: ["Task list"]}}
      - lint-artifacts

  - id: implementation
    phase: implementation
    actor: agent
    skippable: true         # issue-179: everything but the selection gate is
                            # the human's to declare away — a work item whose
                            # delivery already happened elsewhere included.
    produces: [tasks.md]
    command: execute-tasks
    stage: implementation
    entry: [set-phase-label, log-entry, deliver-assignment]
    exit:
      - {hook: validate-artifacts, with: {checkmarks: complete}}
      # The seam between the loops (issue-172): the work item waits here until
      # every started pdlc-pr-loop under docs/specs/<id>/pr-loops/ reaches its
      # `complete` node — "wait for tasks to be complete (inner loop start and
      # finish)". No inner loops started = vacuous pass, the pre-issue-172
      # behaviour for single-session work items.
      - await-inner-loops
      - verify-tests

  # Executing the plan the `test-planning` node locked. It re-declares the SAME
  # artifact — the shape `implementation` already uses for `tasks.md` — because
  # `validate-artifacts` returns *skipped* for a node that declares none, and a
  # gate that reports success without running is the issue-124 failure mode.
  # It sits before the review chain so a failed verification is visible to the
  # reviewers rather than discovered after them (issue-163).
  - id: verification
    phase: verification
    actor: agent
    skippable: true         # issue-179
    produces: [testing-plan.md]
    command: verify-work
    stage: verification
    entry: [set-phase-label, log-entry, deliver-assignment]
    exit:
      - hook: validate-artifacts
        with:
          checkmarks: complete
          sections: [Verification results]
      # A KEPT gate keeps a subject (issue-179). Once `test-planning` became
      # selectable, a work item can walk this node with no `testing-plan.md` to
      # read — and issue-177's planned-absence rule would then let the gate
      # report success having asserted nothing, which is the issue-124/167
      # shape this repository has already fixed twice. So when (and only when)
      # the plan is a planned absence, the proof moves to the shared execution
      # log, beside the sections the review chain already owns. `verification`
      # itself blocks until it is written.
      - hook: validate-artifacts
        with:
          onlyWhenSkipped: testing-plan.md
          validates: execution-log.md
          sections: [Verification results]
      # No-op unless a graph revision binds a command, exactly as on
      # `implementation`: the obvious seam for a project's own verification entry
      # point, without the-loop owning a runner.
      - verify-tests

  # --- everything below was ONE `needs-review` label before this graph -------
  #
  # These six do not *author* an artifact — each owns one section of the SHARED
  # `execution-log.md`. So they declare `validates:` rather than `produces:`,
  # which keeps "produces" meaning "this node wrote it" while still giving each
  # gate a file to read (issue-167, decision-063).
  #
  # Without it they declared no artifact at all, so `validate-artifacts` returned
  # *skipped* on every run and — a skip not being a decision (decision-060) — the
  # chain passed straight through all six, `security-review` included, however
  # empty the log was. `locked:` is deliberately absent: the execution log is
  # append-only and carries `status: in-progress | complete`, never `approved`.

  - id: self-review
    phase: needs-review
    actor: agent
    skippable: true         # issue-179
    stage: self-review
    entry: [set-phase-label, log-entry, deliver-assignment]
    exit:
      - {hook: validate-artifacts, with: {validates: execution-log.md, sections: ["Review cycles"]}}

  - id: critic-review
    actor: agent
    skippable: true         # issue-179
    stage: critic-review
    entry: [log-entry, deliver-assignment]
    exit:
      - {hook: validate-artifacts, with: {validates: execution-log.md, sections: ["Review cycles"]}}

  - id: security-review
    actor: agent
    # `required: true` since decision-063 — "never skippable, at any risk tier",
    # written after this node shipped for months silently skipping. issue-179
    # trades that marker (a node cannot be both required and skippable): the
    # review is now the human's to declare away at `phase-selection`, before any
    # work starts, with their name on the omission. What decision-063 actually
    # fixed still holds — this node can no longer skip ITSELF by resolving no
    # artifact; it either runs and gates the log, or a person declared it away
    # on the record.
    skippable: true         # issue-179
    stage: security-review
    entry: [log-entry, deliver-assignment]
    exit:
      - {hook: validate-artifacts, with: {validates: execution-log.md, sections: ["Security review (gate)"]}}

  - id: evidence
    actor: agent
    skippable: true         # issue-179
    stage: evidence
    entry: [log-entry, deliver-assignment]
    exit:
      - {hook: validate-artifacts, with: {validates: execution-log.md, sections: ["Final validation evidence"]}}

  # Two sections, one node (issue-174, decision-066). `Capability docs` is the
  # ORGANIZED VIEW OF SPECS — current behaviour per capability, for a reader who
  # already uses the-loop. `Documentation` is the USER-FACING surface — README,
  # the docs site, the operating-model skill — for a reader who does not yet.
  # Both rot the same way and both are updated in the same PR, so one node reads
  # both; they stay separate rows because folding them together would lose which
  # of the two was skipped. The INNER loop gates neither: a work item's
  # documentation is decided once, at the outer level, like its requirements.
  - id: capability-docs
    actor: agent
    skippable: true         # issue-179
    stage: capability-docs
    entry: [log-entry, deliver-assignment]
    exit:
      - {hook: validate-artifacts, with: {validates: execution-log.md, sections: ["Capability docs", "Documentation"]}}

  - id: reviewer-briefing
    actor: agent
    skippable: true         # issue-179
    stage: reviewer-briefing
    entry: [log-entry, deliver-assignment]
    exit:
      - {hook: validate-artifacts, with: {validates: execution-log.md, sections: ["Pull requests"]}}

  - id: human-approval
    actor: human
    session: inherit
    # Was `required: true` — the tier-4 gate, bypassable only by an audited
    # force. issue-179 trades that marker too: a human may declare their own
    # approval gate away at `phase-selection`, which is itself a human act by an
    # authorized user, recorded before any work starts. `force` remains the
    # after-the-fact hatch for the item that did NOT declare it away.
    skippable: true         # issue-179
    entry: [set-phase-label, request-review, {hook: notify, with: {event: pr-review-pending}}]
    exit: [classify-feedback]

  - id: complete
    phase: complete
    actor: agent
    command: finish-tasks
    stage: complete
    terminal: true
    entry: [set-phase-label, log-entry]
    exit: []

  # The other end of the life cycle (issue-186). the-loop accumulates LOCAL
  # resources per work item — a tmux session per endpoint, a workspace checkout,
  # a machine-local session record — and nothing ever came back for them. This
  # node is where that teardown is recorded: the-loop enters it (from `complete`
  # on the ordinary path, from wherever the pointer stood on a `wontfix`) just
  # before reclaiming them, so "the resources were released" is a transition with
  # a timestamp rather than an invisible side effect.
  #
  # `actor: code` — nobody is being asked to do anything here; the-loop itself
  # acts. And note the absence of any inbound edge, which is deliberate and has
  # the shipped precedent of `escalated`: this is not a node a work item walks
  # into by satisfying a gate. `complete` therefore stays terminal, which matters
  # because `await-inner-loops`, `on_pr_close` and the dispatcher's status
  # derivation all read it that way.
  - id: cleanup
    phase: cleanup
    actor: code
    terminal: true
    entry: [set-phase-label, log-entry]
    exit: []

  - id: escalated
    actor: human
    terminal: true
    entry: [{hook: notify, with: {event: conflict-escalated}}]
    exit: []

edges:
  - {from: phase-selection, to: brainstorming, on: selected}
  - {from: brainstorming, to: requirements-definition, on: pass}
  - {from: requirements-definition, to: requirements-approval, on: pass}
  # Declared-skip routing (issue-177): each skippable node's `on: skipped` edge
  # is its ordinary forward edge — authored here, never inferred by the runtime.
  # Every node but `phase-selection` and the terminals has one (issue-179), so a
  # work item that declares everything away routes phase-selection → complete
  # with each node in between recorded `skipped` and attributed.
  - {from: brainstorming, to: requirements-definition, on: skipped}
  - {from: requirements-definition, to: requirements-approval, on: skipped}
  - {from: requirements-approval, to: design, on: skipped}
  - {from: design, to: test-planning, on: skipped}
  - {from: test-planning, to: design-approval, on: skipped}
  - {from: design-approval, to: tasks-breakdown, on: skipped}
  - {from: tasks-breakdown, to: implementation, on: skipped}
  - {from: implementation, to: verification, on: skipped}
  - {from: verification, to: self-review, on: skipped}
  - {from: self-review, to: critic-review, on: skipped}
  - {from: critic-review, to: security-review, on: skipped}
  - {from: security-review, to: evidence, on: skipped}
  - {from: evidence, to: capability-docs, on: skipped}
  - {from: capability-docs, to: reviewer-briefing, on: skipped}
  - {from: reviewer-briefing, to: human-approval, on: skipped}
  - {from: human-approval, to: complete, on: skipped}
  - {from: requirements-approval, to: design, on: approved}
  - {from: requirements-approval, to: design, on: approved-with-comments}
  - {from: requirements-approval, to: requirements-definition, on: changes-requested}
  - {from: design, to: test-planning, on: pass}
  - {from: test-planning, to: design-approval, on: pass}
  - {from: design-approval, to: tasks-breakdown, on: approved}
  - {from: design-approval, to: tasks-breakdown, on: approved-with-comments}
  # Back to `design`, not to `test-planning`: the plan is derived from the design,
  # so a change to the design re-derives the plan on the way back through.
  - {from: design-approval, to: design, on: changes-requested}
  - {from: tasks-breakdown, to: implementation, on: pass}
  - {from: implementation, to: verification, on: pass}
  - {from: verification, to: self-review, on: pass}
  - {from: self-review, to: critic-review, on: pass}
  - {from: critic-review, to: security-review, on: pass}
  - {from: security-review, to: evidence, on: pass}
  - {from: evidence, to: capability-docs, on: pass}
  - {from: capability-docs, to: reviewer-briefing, on: pass}
  - {from: reviewer-briefing, to: human-approval, on: pass}
  - {from: human-approval, to: complete, on: approved}
  - {from: human-approval, to: complete, on: approved-with-comments}
  - {from: human-approval, to: implementation, on: changes-requested}
