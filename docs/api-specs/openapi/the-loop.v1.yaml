components:
  schemas:
    CriticRunBody:
      properties:
        repo:
          type: string
          title: Repo
        name:
          type: string
          title: Name
        prompt:
          type: string
          title: Prompt
          default: ''
        promptFile:
          type: string
          title: Promptfile
          default: ''
        workItem:
          type: string
          title: Workitem
          default: ''
        specDir:
          type: string
          title: Specdir
          default: ''
        timeout:
          anyOf:
          - type: number
          - type: 'null'
          title: Timeout
        cwd:
          type: string
          title: Cwd
          default: ''
      type: object
      required:
      - repo
      - name
      title: CriticRunBody
    DaemonControlBody:
      properties:
        daemon:
          type: string
          title: Daemon
        verb:
          type: string
          title: Verb
      type: object
      required:
      - daemon
      - verb
      title: DaemonControlBody
    GraphAdvanceBody:
      properties:
        repo:
          type: string
          title: Repo
        workItem:
          type: string
          title: Workitem
        ref:
          type: string
          title: Ref
          default: ''
        pr:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pr
          description: A pull-request number selects that PR's inner loop
            (pdlc-pr-loop, issue-172); null/omitted is the work item's outer
            pdlc-work-item-loop.
        prRepo:
          type: string
          title: Prrepo
          default: ''
          description: The repository `pr` is in, when the work item's
            contributions span several and this pull request is not in the
            repository the ticket was created in (issue-183). State then lives
            at pr-loops/<owner>__<repo>/pr-<n>/. Meaningless without `pr`.
      type: object
      required:
      - repo
      - workItem
      title: GraphAdvanceBody
    GraphCheckBody:
      properties:
        repo:
          type: string
          title: Repo
        workItem:
          type: string
          title: Workitem
        recompute:
          type: boolean
          title: Recompute
          default: false
        pr:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pr
          description: A pull-request number selects that PR's inner loop
            (pdlc-pr-loop, issue-172); null/omitted is the work item's outer
            pdlc-work-item-loop.
        prRepo:
          type: string
          title: Prrepo
          default: ''
          description: The repository `pr` is in, when the work item's
            contributions span several and this pull request is not in the
            repository the ticket was created in (issue-183). State then lives
            at pr-loops/<owner>__<repo>/pr-<n>/. Meaningless without `pr`.
      type: object
      required:
      - repo
      - workItem
      title: GraphCheckBody
    GraphCompleteBody:
      properties:
        repo:
          type: string
          title: Repo
        workItem:
          type: string
          title: Workitem
        node:
          type: string
          title: Node
          default: ''
        actor:
          type: string
          title: Actor
          default: ''
        ref:
          type: string
          title: Ref
          default: ''
        pr:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pr
          description: A pull-request number selects that PR's inner loop
            (pdlc-pr-loop, issue-172); null/omitted is the work item's outer
            pdlc-work-item-loop.
        prRepo:
          type: string
          title: Prrepo
          default: ''
          description: The repository `pr` is in, when the work item's
            contributions span several and this pull request is not in the
            repository the ticket was created in (issue-183). State then lives
            at pr-loops/<owner>__<repo>/pr-<n>/. Meaningless without `pr`.
      type: object
      required:
      - repo
      - workItem
      title: GraphCompleteBody
    GraphForceBody:
      properties:
        repo:
          type: string
          title: Repo
        workItem:
          type: string
          title: Workitem
        toNode:
          type: string
          title: Tonode
        reason:
          type: string
          title: Reason
        actor:
          type: string
          title: Actor
          default: ''
        ref:
          type: string
          title: Ref
          default: ''
        pr:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pr
          description: A pull-request number selects that PR's inner loop
            (pdlc-pr-loop, issue-172); null/omitted is the work item's outer
            pdlc-work-item-loop.
        prRepo:
          type: string
          title: Prrepo
          default: ''
          description: The repository `pr` is in, when the work item's
            contributions span several and this pull request is not in the
            repository the ticket was created in (issue-183). State then lives
            at pr-loops/<owner>__<repo>/pr-<n>/. Meaningless without `pr`.
      type: object
      required:
      - repo
      - workItem
      - toNode
      - reason
      title: GraphForceBody
    GraphSkipBody:
      properties:
        repo:
          type: string
          title: Repo
        workItem:
          type: string
          title: Workitem
        nodes:
          type: array
          items:
            type: string
          title: Nodes
          description: Skip tokens — skippable node ids and/or shipped skip-set
            names (e.g. spec-chain). Tokens outside the graph's skip vocabulary,
            or naming nodes the pointer already reached, are reported back in
            `rejected` and never take effect (issue-177).
        reason:
          type: string
          title: Reason
        actor:
          type: string
          title: Actor
          default: ''
        ref:
          type: string
          title: Ref
          default: ''
        pr:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pr
          description: A pull-request number selects that PR's inner loop
            (pdlc-pr-loop, issue-172); null/omitted is the work item's outer
            pdlc-work-item-loop. The PR loop declares no skippable node, so
            every token is rejected there by construction.
        prRepo:
          type: string
          title: Prrepo
          default: ''
          description: The repository `pr` is in, when the work item's
            contributions span several and this pull request is not in the
            repository the ticket was created in (issue-183). State then lives
            at pr-loops/<owner>__<repo>/pr-<n>/. Meaningless without `pr`.
      type: object
      required:
      - repo
      - workItem
      - nodes
      - reason
      title: GraphSkipBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SessionCloseBody:
      properties:
        ref:
          type: string
          title: Ref
        keepTmux:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Keeptmux
      type: object
      required:
      - ref
      title: SessionCloseBody
    SessionControlBody:
      properties:
        ref:
          type: string
          title: Ref
        verb:
          type: string
          title: Verb
        comment:
          type: boolean
          title: Comment
          default: true
      type: object
      required:
      - ref
      - verb
      title: SessionControlBody
    SessionReplyBody:
      properties:
        ref:
          type: string
          title: Ref
        text:
          type: string
          title: Text
        actor:
          type: string
          title: Actor
          description: Who is answering — recorded on the event and the ticket for
            the audit trail, never trusted as authentication (the gateway owns auth,
            decision-059).
          default: ''
        comment:
          type: boolean
          title: Comment
          description: Post the marked delivery-report comment on the work item
            (default true; best-effort — a failing comment never fails the reply).
          default: true
      type: object
      required:
      - ref
      - text
      title: SessionReplyBody
    SessionRegisterBody:
      properties:
        ref:
          type: string
          title: Ref
        harness:
          type: string
          title: Harness
        harnessSessionId:
          type: string
          title: Harnesssessionid
        cwd:
          type: string
          title: Cwd
          default: .
        force:
          type: boolean
          title: Force
          default: false
      type: object
      required:
      - ref
      - harness
      - harnessSessionId
      title: SessionRegisterBody
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
