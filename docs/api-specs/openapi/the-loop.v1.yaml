              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions:
    get:
      summary: List Sessions
      operationId: listSessions
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Listsessions
        '422':
          description: Validation Error
          content:
