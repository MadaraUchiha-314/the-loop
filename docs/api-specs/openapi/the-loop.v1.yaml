      summary: Graph Force
      operationId: graphForce
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphForceBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
