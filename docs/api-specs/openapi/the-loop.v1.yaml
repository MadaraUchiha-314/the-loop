  /api/v1/repo/critics/run:
    post:
      summary: Repo Critic Run
      operationId: repoCriticRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriticRunBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
