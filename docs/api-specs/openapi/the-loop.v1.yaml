        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/graph/force:
    post:
      summary: Graph Force
      operationId: graphForce
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphForceBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
