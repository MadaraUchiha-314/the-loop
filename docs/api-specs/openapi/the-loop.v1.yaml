  /api/v1/daemons/control:
    post:
      summary: Control Daemon
      operationId: controlDaemon
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DaemonControlBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
