            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Graphcomplete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/graph/advance:
    post:
      summary: Graph Advance
      operationId: graphAdvance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphAdvanceBody'
