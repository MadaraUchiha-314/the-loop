      operationId: streamEvents
      parameters:
      - name: workItem
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Workitem
      - name: transcript
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Transcript
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: 'An open Server-Sent Events stream. Each frame is one of `log`
