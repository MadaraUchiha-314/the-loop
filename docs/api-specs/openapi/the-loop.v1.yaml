openapi: 3.1.0
info:
  title: the-loop control plane
  version: '1'
  description: 'the-loop''s control-plane API (issue-161). This file is the authored contract:
    cli/tests/test_api_contract_parity.py asserts the served schema matches it, so drift fails
    CI. Docs are served at /api/docs. The service carries no in-app auth (a gateway owns it,
    owner decision PR #162); locally it binds loopback-only by default.'
paths:
  /api/v1/health:
    get:
      summary: Health
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health
  /api/v1/work-items:
    get:
      summary: List Work Items
      operationId: listWorkItems
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Listworkitems
  /api/v1/work-items/one:
    get:
      summary: Get Work Item
      operationId: getWorkItem
      parameters:
      - name: ref
        in: query
        required: true
        schema:
          type: string
          title: Ref
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Getworkitem
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/graph:
    get:
      summary: Graph Show
      operationId: graphShow
      parameters:
      - name: repo
        in: query
        required: true
        schema:
          type: string
          title: Repo
      - name: pr
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pr
        description: A pull-request number selects that PR's inner loop
          (pdlc-pr-loop, issue-172); omitted is the outer pdlc-work-item-loop.
      - name: prRepo
        in: query
        required: false
        schema:
          type: string
          title: Prrepo
          default: ''
        description: The repository `pr` is in, when it is not the repository
          the ticket was created in (issue-183).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Graphshow
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/graph/check:
