openapi: 3.1.0
info:
  title: the-loop control plane
  version: '1'
  description: 'the-loop''s control-plane API (issue-161). This file is the authored contract:
    cli/tests/test_api_contract_parity.py asserts the served schema matches it, so drift fails
    CI. Docs are served at /api/docs. The service carries no in-app auth (a gateway owns it,
    owner decision PR #162); locally it binds loopback-only by default.'
paths:
  /api/v1/health:
    get:
      summary: Health
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health
  /api/v1/work-items:
    get:
      summary: List Work Items
      operationId: listWorkItems
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Listworkitems
  /api/v1/work-items/one:
    get:
      summary: Get Work Item
      operationId: getWorkItem
      parameters:
      - name: ref
        in: query
        required: true
        schema:
          type: string
          title: Ref
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Getworkitem
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/config:
    get:
      summary: Get Config
      operationId: getConfig
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Getconfig
    post:
      summary: Update Config
      operationId: updateConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdateBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Updateconfig
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/config/schema:
    get:
      summary: Get Config Schema
      operationId: getConfigSchema
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Getconfigschema
  /api/v1/graph:
    get:
      summary: Graph Show
      operationId: graphShow
      parameters:
      - name: repo
        in: query
        required: true
        schema:
          type: string
          title: Repo
      - name: pr
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pr
        description: A pull-request number selects that PR's inner loop
          (pdlc-pr-loop, issue-172); omitted is the outer pdlc-work-item-loop.
      - name: prRepo
        in: query
        required: false
        schema:
          type: string
          title: Prrepo
          default: ''
        description: The repository `pr` is in, when it is not the repository
          the ticket was created in (issue-183).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Graphshow
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/graph/check:
    post:
      summary: Graph Check
      description: |-
        Where a work item stands, as `the-loop check` computes it.

        A `repo` that does not resolve to a directory is answered `200` with
        `repoResolved: false`, an empty `nodes` list and no `currentNode` — a
        checkout that has been cleaned up is expected state on the machine that
        cleaned it up, not caller error (issue-238). The field is **absent** on
        every other response. `4xx` stays reserved for a malformed request; the
        mutating graph verbs still refuse a repository that is not there.
      operationId: graphCheck
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphCheckBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Graphcheck
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/graph/complete:
    post:
      summary: Graph Complete
      operationId: graphComplete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphCompleteBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Graphcomplete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
