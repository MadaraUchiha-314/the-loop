              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/one:
    get:
      summary: Get Session
      operationId: getSession
      parameters:
      - name: ref
        in: query
        required: true
        schema:
          type: string
          title: Ref
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Getsession
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/transcript:
    get:
      summary: Session Transcript
      operationId: sessionTranscript
      description: >-
        The harness's own transcript for a work item's session (issue-209).
        the-loop runs the harness as a CLI in tmux, so the structured record of a
        session's turns and tool calls is the harness's file — for Claude Code,
        `<projects root>/<munged cwd>/<harnessSessionId>.jsonl`, both halves recorded
        at registration. Served fail-closed — only a regular `<id>.jsonl` resolving
        inside the harness's projects directory is ever opened. Entries are the file's
        JSONL lines parsed as objects (a line that does not parse is returned as
        `{"malformed": "<line>"}`); `totalLines` counts the whole file and `truncated`
        says whether `entries` is a strict tail. 404 when the work item has no
        registered session (closed sessions still resolve), the harness's transcript
        location is undocumented (Cursor), or no file exists yet.
      parameters:
      - name: ref
        in: query
        required: true
        schema:
          type: string
          title: Ref
      - name: tail
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 200
          title: Tail
        description: Return only the last N entries; 0 means the whole file.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Sessiontranscript
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/control:
    post:
      summary: Control Session
      operationId: controlSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionControlBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Controlsession
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/reply:
    post:
      summary: Reply Session
      operationId: replySession
      description: Deliver an operator's answer into a waiting session's tmux pane
        (bracketed paste, then Enter), emitting `session.reply_sent` and — by default —
        recording a marked report comment on the work item so the ticket stays the
        paper trail (issue-208). The ref resolves the way dispatch resolves it
        (issue-230) — the ref's own record first, else the record holding it as a
        pull-request endpoint — so a PR's ref delivers into that inner loop's pane;
        a closed PR endpoint falls back to the work item's own session. Fail-closed —
        a reply never spawns, respawns or resumes a session — 404 when the work item
        has no registered session or its pane is gone; 400 when the session is paused
        or the text is empty.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionReplyBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Replysession
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/register:
    post:
      summary: Register Session
      operationId: registerSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRegisterBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Registersession
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/link-pr:
    post:
      summary: Link Session Pull Request
      operationId: linkSessionPullRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLinkPrBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Linksessionpullrequest
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/close:
    post:
      summary: Close Session
      operationId: closeSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCloseBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Closesession
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/standing-sessions:
    get:
      summary: List Standing Sessions
      operationId: listStandingSessions
      description: 'Every standing session (issue-277) — the sessions that belong to
        no work item: declared in the CLI config under `standingSessions`, brought up
        by `the-loop start`, addressed by name. Declared and merely recorded sessions
        are both listed, because both are real: a declared one is what `start` will
        bring up, and a recorded one that is no longer declared is a live process an
        operator still has to stop. `running` is tmux''s answer now, not the record''s.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Liststandingsessions
  /api/v1/standing-sessions/one:
    get:
      summary: Get Standing Session
      operationId: getStandingSession
      description: One standing session's row by name. 404 when the name is neither
        declared in `standingSessions.sessions` nor recorded as started.
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Getstandingsession
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/standing-sessions/create:
    post:
      summary: Create Standing Session
      operationId: createStandingSession
      description: 'Bring a standing session into existence without editing
        `standingSessions.sessions` (issue-277 R6, decision-100). The whole definition
        is written to the registry — which is what lets a later start rebuild it with
        no config entry to read — and the session is started unless `start` is false.
        Refuses a name already declared or already recorded (400): a name is one
        session, and adopting an existing one would let a create take over a running
        agent. Every refusal a declared start applies applies here too, because the
        start half is the same code: the name shape, a `cwd` that must exist, and the
        live-occupant refusal. A create whose start fails removes the record it wrote,
        so the name stays free for the retry.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandingCreateBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Createstandingsession
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/standing-sessions/delete:
    post:
      summary: Delete Standing Session
      operationId: deleteStandingSession
      description: 'Stop a created standing session and forget it. The difference from
        `control` with verb `stop` is the record: stop keeps it, so the next start
        resumes the same conversation, and delete removes it, so nothing comes back.
        Refuses a session **declared** in `standingSessions.sessions` (400), naming the
        config key — `the-loop start` would recreate its record on the next boot, so a
        delete that appeared to work would be lying. 404 when the name was never
        created.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandingDeleteBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Deletestandingsession
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/standing-sessions/control:
    post:
      summary: Control Standing Session
      operationId: controlStandingSession
      description: 'Start, stop or restart a standing session. Idempotent in both
        directions: starting a session whose pane is alive reports `already-running`
        and touches nothing, and stopping one that is not running reports
        `not-running`. A start with a recorded conversation id resumes that
        conversation rather than booting blank; a stop keeps the record so the next
        start can. An empty `name` means every declared session for `start` and every
        recorded one for `stop`; `restart` requires a name (400). A live tmux session
        the-loop has no record of is refused, never spawned over.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandingControlBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Controlstandingsession
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/standing-sessions/say:
    post:
      summary: Say To Standing Session
      operationId: sayToStandingSession
      description: 'Paste a message into a running standing session''s TUI and submit
        it, emitting `standing.said`. Nothing is posted to any ticket — a standing
        session has none, so the event log is its paper trail. Fail-closed like
        `sessions/reply`: a message never spawns, respawns or resumes a session — 404
        when the name has never been started or its pane is gone, 400 when the text
        is empty.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandingSayBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Saytostandingsession
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/stream:
    get:
      summary: Stream Events
      description: 'Hold a connection open and push control-plane change to it (issue-239).


        **`async def`, not `def`.** Every other route here is synchronous and runs

        in the anyio threadpool; a synchronous generator held open for hours would

        hold one of its 40 slots for hours, and `maxSubscribers` of them would take

        a fifth of the pool away from the CLI and `/mcp`. As a coroutine this costs

        one task and no thread, which is what makes R5.1 true rather than hoped for.


        Everything that can refuse the connection is decided **before** the

        response begins — capacity, filter, cursor — so a refusal is an ordinary

        JSON error the client can read, and costs the service one rejected request

        rather than a task, a queue and a file handle.'
      operationId: streamEvents
      parameters:
      - name: workItem
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Workitem
      - name: transcript
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Transcript
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: 'An open Server-Sent Events stream. Each frame is one of `log`
            (an event-log record, with its byte offset as the SSE `id` — quote it back
            as `Last-Event-ID` to resume), `transcript` (a watched session''s transcript
            grew), or `desync` (the cursor could not be honoured; refetch everything).
            Interleaved with `: keep-alive` comments. `api.request` and `mcp.call` are
            never carried.'
          content:
            application/json:
              schema: {}
            text/event-stream:
              schema:
                type: string
                title: SSE frames
                example: 'id: 148213

                  event: log

                  data: {"ts":"2026-08-16T16:35:48.114Z","event":"graph.advanced","work_item":"github:octo/repo#7"}


                  '
        '400':
          description: Malformed Last-Event-ID, workItem or transcript.
        '404':
          description: service.stream.enabled is false.
        '503':
          description: service.stream.maxSubscribers connections are already open. Carries
            Retry-After.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/stream:
    get:
      summary: Stream Events
      description: 'Hold a connection open and push control-plane change to it (issue-239).


        **`async def`, not `def`.** Every other route here is synchronous and runs

