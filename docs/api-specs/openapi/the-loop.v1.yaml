        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/restart:
    post:
      summary: Restart
      operationId: restart
      description: Schedule a whole-system restart (issue-228). The service cannot
        stop itself synchronously and still answer, so this spawns a detached
        `the-loop restart` (optionally `--with-upgrade`) and returns at once with
        the spawned pid and its logfile.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestartBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Restart
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/attention:
    get:
      summary: List Attention
      operationId: listAttention
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Listattention
  /api/v1/repo/scenarios:
    get:
      summary: Repo Scenarios
      operationId: repoScenarios
      parameters:
      - name: repo
        in: query
        required: true
        schema:
          type: string
          title: Repo
      - name: glob
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Glob
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Reposcenarios
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/repo/instructions:
    get:
      summary: Repo Instructions
      operationId: repoInstructions
      parameters:
      - name: repo
        in: query
        required: true
        schema:
          type: string
          title: Repo
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Repoinstructions
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/repo/critics:
    get:
      summary: Repo Critics
      operationId: repoCritics
      parameters:
      - name: repo
        in: query
        required: true
        schema:
          type: string
          title: Repo
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Repocritics
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/repo/critics/run:
    post:
      summary: Repo Critic Run
      operationId: repoCriticRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriticRunBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Repocriticrun
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ConfigUpdateBody:
      properties:
        patch:
          additionalProperties: true
          type: object
          title: Patch
      type: object
      required:
      - patch
      title: ConfigUpdateBody
    CriticRunBody:
      properties:
        repo:
          type: string
          title: Repo
        name:
          type: string
          title: Name
        prompt:
          type: string
          title: Prompt
          default: ''
        promptFile:
          type: string
          title: Promptfile
          default: ''
        workItem:
          type: string
          title: Workitem
          default: ''
        specDir:
          type: string
          title: Specdir
          default: ''
        timeout:
          anyOf:
          - type: number
          - type: 'null'
          title: Timeout
        cwd:
          type: string
          title: Cwd
          default: ''
      type: object
      required:
      - repo
      - name
      title: CriticRunBody
    DaemonControlBody:
      properties:
        daemon:
          type: string
          title: Daemon
        verb:
          type: string
          title: Verb
      type: object
      required:
      - daemon
      - verb
      title: DaemonControlBody
    GraphAdvanceBody:
      properties:
        repo:
          type: string
          title: Repo
        workItem:
          type: string
          title: Workitem
        ref:
          type: string
          title: Ref
          default: ''
        pr:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pr
          description: A pull-request number selects that PR's inner loop
            (pdlc-pr-loop, issue-172); null/omitted is the work item's outer
            pdlc-work-item-loop.
        prRepo:
          type: string
          title: Prrepo
          default: ''
          description: The repository `pr` is in, when the work item's
            contributions span several and this pull request is not in the
            repository the ticket was created in (issue-183). State then lives
            at pr-loops/<owner>__<repo>/pr-<n>/. Meaningless without `pr`.
      type: object
      required:
      - repo
      - workItem
      title: GraphAdvanceBody
    GraphCheckBody:
      properties:
        repo:
          type: string
          title: Repo
        workItem:
          type: string
          title: Workitem
        recompute:
          type: boolean
          title: Recompute
          default: false
        pr:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pr
          description: A pull-request number selects that PR's inner loop
            (pdlc-pr-loop, issue-172); null/omitted is the work item's outer
            pdlc-work-item-loop.
        prRepo:
          type: string
          title: Prrepo
          default: ''
          description: The repository `pr` is in, when the work item's
            contributions span several and this pull request is not in the
            repository the ticket was created in (issue-183). State then lives
            at pr-loops/<owner>__<repo>/pr-<n>/. Meaningless without `pr`.
      type: object
      required:
      - repo
      - workItem
      title: GraphCheckBody
    GraphCompleteBody:
      properties:
        repo:
          type: string
          title: Repo
        workItem:
          type: string
          title: Workitem
        node:
          type: string
          title: Node
          default: ''
        actor:
          type: string
          title: Actor
          default: ''
        ref:
          type: string
          title: Ref
          default: ''
        pr:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pr
          description: A pull-request number selects that PR's inner loop
            (pdlc-pr-loop, issue-172); null/omitted is the work item's outer
            pdlc-work-item-loop.
        prRepo:
          type: string
          title: Prrepo
          default: ''
          description: The repository `pr` is in, when the work item's
            contributions span several and this pull request is not in the
            repository the ticket was created in (issue-183). State then lives
            at pr-loops/<owner>__<repo>/pr-<n>/. Meaningless without `pr`.
      type: object
      required:
      - repo
      - workItem
      title: GraphCompleteBody
    GraphForceBody:
      properties:
        repo:
          type: string
          title: Repo
        workItem:
          type: string
          title: Workitem
        toNode:
          type: string
          title: Tonode
        reason:
          type: string
          title: Reason
        actor:
          type: string
          title: Actor
          default: ''
        ref:
          type: string
          title: Ref
          default: ''
        pr:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pr
          description: A pull-request number selects that PR's inner loop
            (pdlc-pr-loop, issue-172); null/omitted is the work item's outer
            pdlc-work-item-loop.
        prRepo:
          type: string
          title: Prrepo
          default: ''
          description: The repository `pr` is in, when the work item's
            contributions span several and this pull request is not in the
            repository the ticket was created in (issue-183). State then lives
            at pr-loops/<owner>__<repo>/pr-<n>/. Meaningless without `pr`.
      type: object
      required:
      - repo
      - workItem
      - toNode
      - reason
      title: GraphForceBody
    GraphSkipBody:
      properties:
        repo:
          type: string
          title: Repo
        workItem:
          type: string
          title: Workitem
        nodes:
          type: array
          items:
            type: string
          title: Nodes
          description: Skip tokens — skippable node ids and/or shipped skip-set
            names (e.g. spec-chain). Tokens outside the graph's skip vocabulary,
            or naming nodes the pointer already reached, are reported back in
            `rejected` and never take effect (issue-177).
        reason:
          type: string
          title: Reason
        actor:
          type: string
          title: Actor
          default: ''
        ref:
          type: string
          title: Ref
          default: ''
        pr:
          anyOf:
          - type: integer
          - type: 'null'
          title: Pr
          description: A pull-request number selects that PR's inner loop
            (pdlc-pr-loop, issue-172); null/omitted is the work item's outer
            pdlc-work-item-loop. The PR loop declares no skippable node, so
            every token is rejected there by construction.
        prRepo:
          type: string
          title: Prrepo
          default: ''
          description: The repository `pr` is in, when the work item's
            contributions span several and this pull request is not in the
            repository the ticket was created in (issue-183). State then lives
            at pr-loops/<owner>__<repo>/pr-<n>/. Meaningless without `pr`.
      type: object
      required:
      - repo
      - workItem
      - nodes
      - reason
      title: GraphSkipBody
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RestartBody:
      properties:
        withUpgrade:
          type: boolean
          title: Withupgrade
          default: false
      type: object
      title: RestartBody
    StandingCreateBody:
      properties:
        name:
          type: string
          title: Name
          description: The session's identity everywhere. Lowercase letters, digits and
            hyphens, not starting with a hyphen, at most 40 characters.
        harness:
          type: string
          title: Harness
          description: claude or cursor. Empty inherits routing.defaultHarness.
          default: ''
        cwd:
          type: string
          title: Cwd
          description: Where the session runs; it must exist. Empty inherits
            routing.spawnWorkdir.
          default: ''
        prompt:
          type: string
          title: Prompt
          description: The session's brief. Appended to the-loop's own directive (you
            own no work item; do not answer a phase gate or post a control keyword on
            any ticket), never substituted for it.
          default: ''
        description:
          type: string
          title: Description
          description: What this session is for, in one line. Never sent to the harness.
          default: ''
        harnessArgs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Harnessargs
          description: Extra CLI arguments for the harness. Absent inherits
            routing.harnessArgs for the resolved harness; an empty list means none.
        slackEnabled:
          type: boolean
          title: Slackenabled
          description: Announce the session in Slack on start and bind that thread to
            it. Requires channels.slack.enabled; best-effort, never gates the start.
          default: false
        slackChannel:
          type: string
          title: Slackchannel
          description: The channel id to announce in. Empty uses channels.slack.channel.
          default: ''
        autoStart:
          type: boolean
          title: Autostart
          description: Whether `the-loop start` brings this session back. True by
            default, because stop_all stops every recorded session — without the
            symmetry a restart would destroy what this route created.
          default: true
        start:
          type: boolean
          title: Start
          description: Start the session as part of the create. False records the
            definition without running anything.
          default: true
      type: object
      required:
      - name
      title: StandingCreateBody
    StandingDeleteBody:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: StandingDeleteBody
    StandingControlBody:
      properties:
        name:
          type: string
          title: Name
          description: The standing session's name. Empty means every declared session
            for `start` and every recorded one for `stop`; `restart` requires one. A
            standing session is never addressed by a work-item ref — the two
            namespaces are separate so nothing routes an event between them.
          default: ''
        verb:
          type: string
          title: Verb
          description: 'One of: start, stop, restart.'
      type: object
      required:
      - verb
      title: StandingControlBody
    StandingSayBody:
      properties:
        name:
          type: string
          title: Name
        text:
          type: string
          title: Text
        actor:
          type: string
          title: Actor
          description: Who is speaking — recorded on the event for the audit trail,
            never trusted as authentication (the gateway owns auth, decision-059).
          default: ''
      type: object
      required:
      - name
      - text
      title: StandingSayBody
    SessionCloseBody:
      properties:
        ref:
          type: string
          title: Ref
        keepTmux:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Keeptmux
      type: object
      required:
      - ref
      title: SessionCloseBody
    SessionControlBody:
      properties:
        ref:
          type: string
          title: Ref
        verb:
          type: string
          title: Verb
        comment:
          type: boolean
          title: Comment
          default: true
      type: object
      required:
      - ref
      - verb
      title: SessionControlBody
    SessionReplyBody:
      properties:
        ref:
          type: string
          title: Ref
        text:
          type: string
          title: Text
        actor:
          type: string
          title: Actor
          description: Who is answering — recorded on the event and the ticket for
            the audit trail, never trusted as authentication (the gateway owns auth,
            decision-059).
          default: ''
        comment:
          type: boolean
          title: Comment
          description: Post the marked delivery-report comment on the work item
            (default true; best-effort — a failing comment never fails the reply).
          default: true
      type: object
      required:
      - ref
      - text
      title: SessionReplyBody
    SessionLinkPrBody:
      properties:
        ref:
          type: string
          title: Ref
        pullRequest:
          type: string
          title: Pullrequest
      type: object
      required:
      - ref
      - pullRequest
      title: SessionLinkPrBody
    SessionRegisterBody:
      properties:
        ref:
          type: string
          title: Ref
        harness:
          type: string
          title: Harness
        harnessSessionId:
          type: string
          title: Harnesssessionid
        cwd:
          type: string
          title: Cwd
          default: .
        force:
          type: boolean
          title: Force
          default: false
      type: object
      required:
      - ref
      - harness
      - harnessSessionId
      title: SessionRegisterBody
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
