      - name: workItem
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workitem
      - name: deliveryId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Deliveryid
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
      - name: level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Since
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Queryevents
        '422':
