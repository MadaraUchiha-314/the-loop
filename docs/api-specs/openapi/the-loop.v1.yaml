      operationId: graphCheck
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphCheckBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Graphcheck
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/graph/complete:
    post:
