                  event: log

                  data: {"ts":"2026-08-16T16:35:48.114Z","event":"graph.advanced","work_item":"github:octo/repo#7"}


                  '
        '400':
          description: Malformed Last-Event-ID, workItem or transcript.
        '404':
          description: service.stream.enabled is false.
        '503':
          description: service.stream.maxSubscribers connections are already open. Carries
            Retry-After.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/events:
    get:
      summary: Query Events
      operationId: queryEvents
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Type
      - name: workItem
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workitem
      - name: deliveryId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Deliveryid
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
      - name: level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Since
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Queryevents
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/events/types:
    get:
      summary: Event Types
      operationId: eventTypes
      responses:
        '200':
          description: Successful Response
