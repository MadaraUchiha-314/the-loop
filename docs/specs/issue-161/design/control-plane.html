<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the-loop — control plane (design prototype, issue-161)</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b21; --panel2: #1f232b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #6aa2ff; --ok: #4cc38a;
    --warn: #e5b567; --bad: #e5726a; --chip: #262b35;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px;
           border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .api { margin-left: auto; display: flex; gap: 8px; align-items: center;
                color: var(--muted); font-size: 12px; }
  header input { background: var(--panel2); border: 1px solid var(--border);
                 color: var(--text); border-radius: 6px; padding: 4px 8px; font-size: 12px; }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; }
  nav button { background: none; border: none; color: var(--muted); padding: 8px 12px;
               cursor: pointer; border-bottom: 2px solid transparent; font-size: 14px; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: 14px 16px; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .card .ref { color: var(--muted); font-size: 12px; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px;
          padding: 2px 10px; font-size: 12px; margin-top: 8px; }
  .chip.phase { color: var(--accent); }
  .chip.wait { color: var(--warn); }
  .chip.block { color: var(--bad); }
  .chip.ok { color: var(--ok); }
  .attn { border-left: 3px solid var(--warn); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border);
           font-size: 13px; }
  th { color: var(--muted); font-weight: 500; }
  .node-ok { color: var(--ok); } .node-wait { color: var(--warn); }
  .node-block { color: var(--bad); } .node-idle { color: var(--muted); }
  .controls { display: flex; gap: 8px; margin-top: 12px; }
  .controls button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
                     border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .controls button:hover { border-color: var(--accent); }
  .events { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted);
            background: var(--panel2); border-radius: 8px; padding: 10px 12px; margin-top: 12px;
            overflow-x: auto; }
  .back { color: var(--accent); background: none; border: none; cursor: pointer;
          padding: 0 0 12px; font-size: 13px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1>the-loop · control plane</h1>
  <span class="api">API <input value="http://127.0.0.1:4114" size="18"> token <input type="password" value="••••••••" size="8"></span>
</header>
<nav>
  <button class="active" data-v="items">Work items</button>
  <button data-v="attention">Needs attention <span class="chip wait">2</span></button>
</nav>
<main id="main"></main>
<script>
// Mock data mirroring /api/v1 shapes (workitems.list, graphs.check, attention.list, events.query)
const items = [
  { ref: "github:MadaraUchiha-314/the-loop#161", title: "Control plane and API layer",
    phase: "implementation", session: "active", gate: "ok",
    nodes: [["requirements-definition","ok"],["requirements-approval","ok"],["design","ok"],
            ["design-approval","wait"],["tasks-breakdown","idle"],["implementation","idle"]],
    events: ["07:24 api.session.control verb=status ref=…#161",
             "07:22 dispatch.spawned harness=claude ref=…#161",
             "07:20 api.graph.check recompute=true ref=…#161"] },
  { ref: "github:MadaraUchiha-314/the-loop#159", title: "Poller idempotent across stop/restart",
    phase: "complete", session: "closed", gate: "ok",
    nodes: [["implementation","ok"],["self-review","ok"],["security-review","ok"],["complete","ok"]],
    events: ["06:02 session.closed ref=…#159"] },
  { ref: "github:MadaraUchiha-314/the-loop#157", title: "Cursor plugin install from a terminal",
    phase: "requirements-definition", session: "none", gate: "wait",
    nodes: [["requirements-definition","ok"],["requirements-approval","wait"]],
    events: [] },
];
const attention = [
  { ref: items[0].ref, why: "design-approval waiting on human feedback", kind: "wait" },
  { ref: items[2].ref, why: "requirements-approval waiting on human feedback", kind: "wait" },
];
const main = document.getElementById("main");
const chip = (t, c) => `<span class="chip ${c}">${t}</span>`;
function listView() {
  main.innerHTML = `<div class="grid">` + items.map((w, i) => `
    <div class="card ${attention.some(a => a.ref === w.ref) ? "attn" : ""}" onclick="detail(${i})">
      <h3>${w.title}</h3><div class="ref">${w.ref}</div>
      ${chip(w.phase, "phase")} ${chip("session: " + w.session, "")}
      ${w.gate === "wait" ? chip("waiting on human", "wait") : chip("gates ok", "ok")}
    </div>`).join("") + `</div>
    <p class="note">Prototype (issue-161 design phase). Data mocked in the shapes of
    /api/v1/work-items, /work-items/{ref}/check, /attention, /events.</p>`;
}
function attentionView() {
  main.innerHTML = `<table><tr><th>Work item</th><th>Why</th></tr>` +
    attention.map(a => `<tr><td>${a.ref}</td><td>${chip(a.why, a.kind)}</td></tr>`).join("") +
    `</table>`;
}
function detail(i) {
  const w = items[i];
  main.innerHTML = `
    <button class="back" onclick="listView()">← all work items</button>
    <h2 style="margin:0 0 2px">${w.title}</h2><div class="ref">${w.ref} · ${chip(w.phase, "phase")}</div>
    <table><tr><th>Graph node</th><th>State</th></tr>
      ${w.nodes.map(([n, s]) => `<tr><td>${n}</td><td class="node-${s}">${s.toUpperCase()}</td></tr>`).join("")}
    </table>
    <div class="controls">
      <button>start</button><button>pause</button><button>resume</button><button>stop</button>
    </div>
    <div class="events">${w.events.length ? w.events.join("<br>") : "no recent events"}</div>`;
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  b.dataset.v === "items" ? listView() : attentionView();
});
listView();
</script>
</body>
</html>
