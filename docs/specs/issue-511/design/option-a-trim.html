    <title>the-loop · Option A — Trim</title>
    <!--
      issue-511 design prototype — Option A (Trim).

      Self-contained (reference/design-artifacts.md): inline CSS and JS, no
      network, no fonts fetched — the app's font stacks fall back to the
      system faces here. The tokens are the issue-327 set from
      ui/src/styles/app.css, copied verbatim; every class below is a
      hand-written equivalent of a Tailwind utility the app already uses.
      The data is the demo fixture's shape (ui/src/demo/fixture.ts), typed
      by hand. A prototype, not production code: implementation derives
      from it with the existing React primitives.

      Generated from one template so the three options differ only by the
      OPTION constant: everything A removes, B removes; everything B
      removes, C removes (requirements R1.2).
    -->
    <script>
      (function () {
        var theme = "";
        try {
          theme = localStorage.getItem("the-loop:proto:theme") || "";
        } catch (_) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
    <style>

      .dark {

        --primary: oklch(75% 0.14 55);

      * { box-sizing: border-box; border-color: var(--border); }
      html, body { height: 100%; margin: 0; }

        background: var(--background);

      /* — idiom ————————————————————————————————— */
      .mono { font-family: var(--font-mono); }
      .muted { color: var(--muted-foreground); }
      .fg90 { color: color-mix(in oklab, var(--foreground) 90%, transparent); }

      .xs { font-size: 0.75rem; }

      .t-blocked { color: var(--state-blocked); }
      .t-skipped { color: var(--state-skipped); }
      .t-pending { color: var(--state-pending); }
      .dot { display: inline-flex; height: 6px; width: 6px; flex-shrink: 0; border-radius: 999px; background: currentColor; }
      .dot.pulse { position: relative; }
      .dot.pulse::after {
        content: ""; position: absolute; inset: -4px; border: 1px solid; border-radius: 999px; opacity: 0.35;
        animation: loop-pulse 2s ease-out infinite;
      }
      @keyframes loop-pulse { 0% { opacity: 0.5; transform: scale(0.7); } to { opacity: 0; transform: scale(1.35); } }
      @media (prefers-reduced-motion: reduce) { .dot.pulse::after { animation: none; } }
      .ref-chip {
        font-family: var(--font-mono); letter-spacing: -0.01em; font-size: 0.72rem; background: var(--surface-2);
        color: var(--muted-foreground); border: 1px solid var(--border); border-radius: 0.3rem; padding: 0.05rem 0.35rem;
      }

      }
      .ibtn:hover, .ibtn.on { border-color: var(--border); background: var(--surface-2); color: var(--foreground); }
      .ctl {
        border-radius: 0.5rem; border: 1px solid var(--border); padding: 0.375rem 0.5rem; font-family: var(--font-mono);
        font-size: 0.7rem; color: var(--muted-foreground); transition: color 0.15s, background 0.15s; display: inline-flex; align-items: center; gap: 0.375rem;

      /* — graph strip ——————————————————————————— */

      .nodes { margin-top: 0.75rem; display: flex; align-items: center; gap: 0.25rem; overflow-x: auto; padding-bottom: 0.25rem; }

      .nodes li { display: flex; flex-shrink: 0; align-items: center; gap: 0.25rem; }
      .nodes .gap { padding: 0 0.25rem; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted-foreground); }
      .nodes .link { height: 1px; width: 0.75rem; flex-shrink: 0; background: var(--border-strong); }

      .node.done { background: var(--surface-2); color: color-mix(in oklab, var(--foreground) 90%, transparent); }

      /* — tabs, trace, composer ————————————————— */
      .tabs { display: flex; align-items: center; gap: 0.25rem; overflow-x: auto; border-bottom: 1px solid var(--border); padding: 0 1.5rem; }
      .tab { margin-bottom: -1px; display: flex; flex-shrink: 0; align-items: center; gap: 0.5rem; border-bottom: 2px solid transparent; padding: 0.625rem 0.75rem; font-size: 0.875rem; color: var(--muted-foreground); }
      .tab:hover { color: var(--foreground); }
      .tab[aria-current="page"] { border-bottom-color: var(--primary); color: var(--foreground); }
      .tab .repo { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted-foreground); }
      .tabs .tally { margin-left: auto; flex-shrink: 0; padding: 0.625rem 0; font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted-foreground); }
      .column { display: flex; min-height: 0; flex: 1; flex-direction: column; }

      .fold .sum { font-family: var(--font-mono); color: var(--muted-foreground); }
      .centered { text-align: center; font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted-foreground); }
      .empty { padding: 1.5rem 0; text-align: center; font-size: 0.875rem; color: var(--muted-foreground); }
      .eventline .detail { padding-left: 1.4rem; font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted-foreground); overflow-wrap: anywhere; }

      .banner-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.5rem; }

      if (items.length === 0) return "";
      return `<div class="group">
  <div class="group-head"><span class="kicker">${g.title}</span>${g.key === "needs-you" ? `<span class="count">${items.length}</span>` : ""}</div>
  <ul class="rows">${items.map((it) => renderRow(it, sel)).join("")}</ul>
</div>`;
    }).join("")}
    ${L < 3 && STANDING.length > 0 ? `<div class="group">
  <div class="group-head"><span class="kicker">Standing</span></div>
  <ul class="rows">
    ${STANDING.map((s) => `<li><a href="#standing" class="standing-row" data-row="standing"><div class="line">${dot(s.running ? "active" : "pending")}<span class="name trunc">${esc(s.name)}</span></div>${L < 2 ? `<div class="desc trunc">${esc(s.description)}</div>` : ""}</a></li>`).join("")}
    <li><a href="#standing" class="manage">Manage standing sessions →</a></li>
  </ul>
</div>` : ""}
  </nav>
  <div class="foot">
    <a class="ibtn" href="#settings" aria-label="Settings" title="Settings">${I.settings(16)}</a>
    <div class="lines"><a href="#settings">Settings</a><div class="svc trunc" title="demo fixture">demo fixture</div></div>
    <details class="health">
      <summary aria-label="Service health: live" class="t-done">${dot("done")}live</summary>
      <div class="pop" role="status" aria-live="polite">
        <div>Stream live, connected 2h ago.</div>
        <div class="line">${dot("done")}<span class="mono">poller</span><span class="muted">running · last cycle 1m ago</span></div>
        <div class="line">${dot("done")}<span class="mono">webhook</span><span class="muted">running · last cycle 4m ago</span></div>
        <div style="padding-top:.25rem"><button type="button" class="ctl">${I.refresh(12)}Refresh now</button></div>
      </div>
    </details>
  </div>
</aside>`;
      }
      function renderRow(it, sel) {
        const selected = state.viewed === it.ref;
        const owner = !selected && it.ref === state.selected;
        const showPrs = it.prs.length > 0 && (L < 2 || it.ref === state.selected);
        const urgent = it.flag && it.flag.urgent ? it.flag : null;
        const name = `${shortRef(it.ref)} — ${it.title}${urgent ? ` — ${urgent.label}` : ""}`;
        return `<li>
  <a href="${href(it.ref)}" class="row" data-row="item" aria-label="${esc(name)}" ${selected ? 'aria-current="page"' : ""} ${owner ? 'data-owner="true"' : ""}>
    <div class="line">${dot(it.status)}<span class="num">#${it.number}</span><span class="title ${L >= 2 ? "one" : "two"}">${esc(it.title)}</span>${L >= 2 && urgent ? `<span class="flag t-blocked">${esc(urgent.label)}</span>` : ""}</div>
    ${L < 2 && urgent ? `<div class="sub t-blocked">${esc(urgent.label)}</div>` : ""}
  </a>
  ${showPrs ? `<ul class="prs" aria-label="Pull requests for ${esc(shortRef(it.ref))}">${it.prs.map((pr) => `<li><a href="${href(pr.ref)}" class="pr" data-row="pr" aria-label="${esc(shortRef(pr.ref))}" ${state.viewed === pr.ref ? 'aria-current="page"' : ""}>${dot(sessionDot(pr.state))}<span class="muted">${I.pr(12)}</span><span class="mono">${esc(pr.label)}</span>${L < 2 ? `<span class="age">${esc(pr.age)}</span>` : ""}</a></li>`).join("")}</ul>` : ""}
</li>`;
      }

      /* — main column ——————————————————————————— */
      function renderMain(it) {
        const pr = it.prs.find((p) => p.ref === state.viewed) || null;
        const sess = pr ? pr.session : it.session;
        const sessState = pr ? pr.state : it.session.state;
        const verbs = it.session.state === "active" ? ["pause", "stop"] : it.session.state === "paused" ? ["resume", "stop"] : ["start"];
        const phase = it.currentNode;
        const noteHtml = it.note ? `<span class="${it.note.startsWith("parked") || it.rail.some((n) => n.state === "blocked") ? "t-blocked" : ""}" title="${esc(it.note)}">${esc(it.note)}</span>` : "";
        const blockedReason = sessState === "active" ? "" : sessState === "paused" ? "The session is paused — resume it first; delivery is held." : sessState === "closed" ? "The session is closed; there is no pane to deliver into." : "No session is registered for this ref on the service's machine.";
        const sessions = 1 + it.prs.length;

        const header = `
<header class="bar">
  ${state.sidebarOpen ? "" : `<button type="button" class="ibtn" aria-label="Open sidebar" title="Open sidebar" data-act="open-sidebar">${I.panelLeftOpen(16)}</button>`}
  <div class="heading">
    <h1>${esc(it.title)}</h1>
    <div class="meta">
      ${L < 2 ? `<span class="ref-chip">${esc(it.ref)}</span>` : ""}
      <span class="chip t-${it.status}">${dot(it.status)}<span class="muted">loop:</span><span style="color:var(--foreground)">${esc(phase)}</span></span>
      ${L >= 3 && noteHtml ? `<span aria-hidden="true">·</span>${noteHtml}` : ""}
      <span aria-hidden="true">·</span><span>updated ${esc(it.age)}</span>
      ${L >= 3 ? `<span aria-hidden="true">·</span><button type="button" class="fullgraph" aria-expanded="${state.graphOpen}" data-act="graph">${state.graphOpen ? "Collapse graph" : "Full graph"}<span class="rotate" style="display:inline-flex">${I.chevronDown(14)}</span></button>` : ""}
    </div>
  </div>
  <div class="actions">
    ${L >= 3 ? `<div class="verbs" role="group" aria-label="${pr ? "Controls · work item session" : "Controls"}">${verbs.map((v) => `<button type="button" class="ctl" title="prototype — no action">${v}</button>`).join("")}</div>` : ""}
    <button type="button" class="ibtn" aria-label="${state.copied === "ref" ? "Copied" : "Copy work item ref"}" title="Copy work item ref" data-act="copy" data-text="${esc(it.ref)}" data-key="ref">${state.copied === "ref" ? svg('<path d="M20 6 9 17l-5-5"/>', 16) : I.copy(16)}</button>
    <a class="ibtn" href="${esc(it.url)}" target="_blank" rel="noreferrer" aria-label="Open on GitHub" title="Open on GitHub">${I.external(16)}</a>
    <button type="button" class="ibtn" aria-label="${state.theme === "dark" ? "Switch to light theme" : "Switch to dark theme"}" title="Switch theme" data-act="theme">${state.theme === "dark" ? I.sun(16) : I.moon(16)}</button>
    ${L >= 3 ? renderDetailsPop(it, pr, sess) : state.asideOpen ? "" : `<button type="button" class="ibtn" aria-label="Open session panel" title="Open session panel" data-act="open-aside">${I.panelRightOpen(16)}</button>`}
  </div>
</header>`;

        const nodesRow = (nodes, bare) => `<ol class="nodes scroll-thin ${bare ? "bare" : ""}" role="list" aria-label="loop position">${nodes.map((n, i) => n === "gap" ? `<li class="gap" aria-label="nodes folded">···</li>` : `<li data-node="${n.id}"><span class="node ${n.state}" title="${esc(humanize(n.id))} · ${n.state}" aria-label="${esc(n.id)} — ${n.state}" ${n.state === "current" ? 'aria-current="step"' : ""}>${dot(n.state === "current" ? "active" : n.state)}<span class="label">${esc(humanize(n.id))}</span>${n.state === "blocked" ? '<span class="bang">!</span>' : ""}</span>${i < nodes.length - 1 ? '<span class="link" aria-hidden="true"></span>' : ""}</li>`).join("")}</ol>`;
        const strip = L >= 3
          ? (state.graphOpen ? `<section class="strip" aria-label="Loop position"><div class="line"><div class="words"><span class="mono" style="color:var(--foreground)">pdlc-work-item-loop</span></div></div>${nodesRow(it.rail, false)}</section>` : "")
          : `<section class="strip" aria-label="Loop position">
  <div class="line">
    <div class="words"><span class="mono" style="color:var(--foreground)">pdlc-work-item-loop</span>${noteHtml ? `<span aria-hidden="true">·</span>${noteHtml}` : ""}</div>
    <button type="button" class="toggle" aria-expanded="${state.graphOpen}" data-act="graph">${state.graphOpen ? "Collapse graph" : "Full graph"}<span class="rotate" style="display:inline-flex">${I.chevronDown(14)}</span></button>
  </div>
  ${nodesRow(state.graphOpen ? it.rail : compact(it.rail), false)}
</section>`;

        const tabs = sessions > 1 ? `<div class="tabs scroll-thin" role="navigation" aria-label="Sessions">
  <a href="${href(it.ref)}" class="tab" aria-label="${esc(shortRef(it.ref))}" ${state.viewed === it.ref ? 'aria-current="page"' : ""}>${I.terminalSquare(14)}<span>Work item loop</span>${it.session.state === "paused" ? `<span class="t-blocked">${I.pause(12)}</span>` : ""}</a>
  ${it.prs.map((p) => `<a href="${href(p.ref)}" class="tab" aria-label="${esc(shortRef(p.ref))}" ${state.viewed === p.ref ? 'aria-current="page"' : ""}>${I.pr(14)}<span>PR #${p.number}</span>${p.repo ? `<span class="repo">${esc(p.repo.split("/").at(-1))}</span>` : ""}</a>`).join("")}
</div>` : "";

        const traceHead = `<div class="tracehead">
  <span>Harness trace${L < 2 && sess.harness ? `<span class="mono"> · ${esc(sess.harness)}</span>` : ""}</span>
  <label class="switch" title="Show the tool calls, the harness bookkeeping and the whole event trail"><span>Verbose</span><span role="switch" aria-checked="${state.verbose}" aria-label="Verbose" tabindex="0" class="track" data-act="verbose"><span class="knob"></span></span></label>
</div>`;

        const banners = it.parked || it.question ? `<div class="banners"><div class="inner">
  ${it.parked ? `<div class="notice" role="status"><span style="margin-top:2px">${I.alert(14)}</span><div class="body">
    <div class="banner-title"><span class="name">Human gate</span><span class="when" title="since">waiting ${esc(it.parked.since)}</span></div>
    <div>${esc(it.parked.reason)}</div>
    <div class="banner-actions"><button type="button" class="ctl primary" title="prototype — no action">Approve — advance graph</button><a href="${esc(it.url)}" target="_blank" rel="noreferrer">Request changes on the ticket ↗</a></div>
  </div></div>` : ""}
  ${it.question ? `<div class="notice" role="status"><span style="margin-top:2px">${I.alert(14)}</span><div class="body">
    <div class="banner-title"><span class="name">The loop asks</span><span class="when">${esc(it.question.age)}</span></div>
    <div class="question">${esc(it.question.text)}</div>
    <div style="opacity:.8">Reply below — delivered into the session, recorded on the ticket. <a href="${esc(it.question.url)}" target="_blank" rel="noreferrer" style="text-underline-offset:2px">Answer on the ticket instead ↗</a></div>
  </div></div>` : ""}
</div></div>` : "";

        const composer = `<div class="composer"><div class="inner">
  <div class="box ${blockedReason ? "blocked" : ""}">
    <textarea rows="1" placeholder="${esc(blockedReason || "Reply into the session")}" aria-label="Message the session for ${esc(state.viewed)}" ${blockedReason ? "disabled" : ""}></textarea>
    <button type="button" class="send" aria-label="Send" title="${esc(blockedReason || "Send (⌘⏎)")}" ${blockedReason ? "disabled" : ""}>${I.send(14)}</button>
  </div>
  ${blockedReason ? `<div class="hint"><span>${esc(blockedReason)}</span></div>` : ""}
</div></div>`;

        return `${header}${strip}${tabs}<div class="column">${traceHead}${renderTrace(it, pr)}${banners}${composer}</div>`;
      }
      function compact(nodes) {
        const anchor = Math.max(nodes.findIndex((n) => n.state === "current" || n.state === "blocked"), 0);
        const out = [];
        nodes.forEach((n, i) => {
          const near = Math.abs(i - anchor) <= 2, edge = i === 0 || i === nodes.length - 1;
          if (near || edge) out.push(n); else if (out.at(-1) !== "gap") out.push("gap");
        });
        return out;
      }
      function renderTrace(it, pr) {
        if (it.fallback) {
          return `<div class="trace scroll-thin" role="log" aria-label="Session transcript" tabindex="0"><div class="inner">
  <div class="notice mutedtone"><span style="margin-top:2px">${I.alert(14)}</span><div class="body"><div><strong style="font-weight:500;color:var(--foreground)">No transcript served for this session.</strong> No session is registered for this ref on the service's machine.</div><div>Falling back to the event-log trail for this work item.</div></div></div>
  <div class="entry eventline"><div class="metaline"><span class="t-skipped">${I.arrow(14)}</span><span class="label">graph.parked</span><span class="hair" aria-hidden="true"></span><span class="time">10:42</span></div><p class="detail">node=${esc(it.currentNode)} reason=${esc(it.parked ? it.parked.reason : "")}</p></div>
  <div class="entry eventline"><div class="metaline"><span class="t-skipped">${I.arrow(14)}</span><span class="label">poll.spawn_failed</span><span class="hair" aria-hidden="true"></span><span class="time">09:11</span></div><p class="detail">reason=armed but spawn budget exhausted gave_up=false</p></div>
</div></div>`;
        }
        const who = pr ? `PR #${pr.number}` : "the work item";
        const toolGroup = state.verbose ? `<details class="fold" data-fold="tools"><summary>${I.wrench(14)}<span>Used 3 tools</span>${I.chevronRight(14)}</summary><ul>
  <li>${I.terminal(12)}<span class="tool">Read</span><span class="sum trunc">docs/specs/issue-${it.number}/tasks.md</span></li>
  <li>${I.terminal(12)}<span class="tool">Write</span><span class="sum trunc">briefing.md</span></li>
  <li>${I.terminal(12)}<span class="tool">Bash</span><span class="sum trunc">gh pr edit --body-file briefing.md</span></li></ul></details>` : "";
        return `<div class="trace scroll-thin" role="log" aria-label="Session transcript" tabindex="0"><div class="inner">
  <p class="centered">tail — the last 200 of 1 412 entries</p>
  <div class="entry"><div class="metaline"><span class="muted">${I.bot(14)}</span><span class="label">the-loop</span><span class="hair" aria-hidden="true"></span><span class="time">10:31</span></div>
    <div class="prose"><p>Verification passed for ${who}: <code class="ref-chip">bun run test</code> is green across the matrix and the evidence is committed under <code class="ref-chip">docs/specs/issue-${it.number}/evidence/</code>.</p>
    <p class="bullet">• <strong style="font-weight:600">Self-review 1 of 2</strong> found two naming nits; both folded in.</p>
    <p class="bullet">• The critic round is queued behind the security review.</p></div>${toolGroup}</div>
  <div class="bubble-wrap"><div class="bubble">Keep the briefing short — lead with what to look at first.</div><span class="mono" style="font-size:.68rem;color:var(--muted-foreground)">10:36</span></div>
  <div class="entry"><div class="metaline"><span class="muted">${I.bot(14)}</span><span class="label">the-loop</span><span class="hair" aria-hidden="true"></span><span class="time">10:38</span></div>
    <div class="prose"><p>Done. The briefing now opens with the two files that carry the behaviour change, then the mermaid of the call path, then the decisions. I am at <code class="ref-chip">${esc(pr ? pr.currentNode : it.currentNode)}</code> and will report back with <code class="ref-chip">the-loop graph complete</code> once the checks finish.</p></div></div>
</div></div>`;
      }

      /* — session panel (A, B) and the details disclosure (C) ———————— */
      function idRow(k, value, short) {
        if (!value) return `<div class="kv"><span class="k">${k}</span><span class="v mono">—</span></div>`;
        return `<div class="kv"><span class="k">${k}</span><span class="v mono id" title="${esc(value)}"><span>${esc(short)}</span><button type="button" aria-label="Copy ${k}" title="Copy ${k}" data-act="copy" data-text="${esc(value)}" data-key="${k}">${state.copied === k ? svg('<path d="M20 6 9 17l-5-5"/>', 12) : I.copy(12)}</button></span></div>`;
      }
      function harnessRows(it, pr, sess, sessState) {
        return `<div class="kvs">
  <div class="kv"><span class="k">harness</span><span class="v mono">${esc(sess.harness || "—")}</span></div>
  <div class="kv"><span class="k">status</span><span class="v mono">${esc(sessState === "none" ? "no session" : sessState)}</span></div>
  ${sess.started ? `<div class="kv"><span class="k">started</span><span class="v">${esc(sess.started)}</span></div>` : ""}
  ${idRow("session id", sess.id, abbrev(sess.id || "", 8))}
  ${idRow("transcript", sess.transcript, sess.transcript ? lastSeg(sess.transcript) : "")}
</div>`;
      }
      function tmuxRows(sess) {
        return `<div class="kvs">
  ${idRow("cwd", sess.cwd, sess.cwd ? lastSeg(sess.cwd) : "")}
  ${sess.tmux ? `<button type="button" class="attach" title="Copy to the clipboard" data-act="copy" data-text="tmux attach -t ${esc(sess.tmux)}" data-key="attach">${I.copy(12)}<span>${state.copied === "attach" ? "copied" : `tmux attach -t ${esc(sess.tmux)}`}</span></button>` : ""}
</div>`;
      }
      function ticketRows(it, pr) {
        const url = pr ? pr.url : it.url;
        return `<div class="kvs">
  ${L >= 2 ? `<div class="kv"><span class="k">ref</span><span class="v mono">${esc(pr ? pr.ref : it.ref)}</span></div>` : ""}
  ${pr ? `<div class="kv"><span class="k">inner loop</span><span class="v mono">${esc(pr.currentNode)}</span></div>` : ""}
  <a class="ext" href="${esc(url)}" target="_blank" rel="noreferrer">${I.external(14)}Open on GitHub</a>
</div>`;
      }
      function controls(it, pr) {
        const verbs = it.session.state === "active" ? ["pause", "stop"] : it.session.state === "paused" ? ["resume", "stop"] : ["start"];
        return `<div class="verbs-grid">${verbs.map((v) => `<button type="button" class="ctl" title="prototype — no action">${v}</button>`).join("")}</div>${it.session.state === "none" ? `<p class="muted" style="font-size:.7rem;margin-top:.375rem">No session on this machine — start spawns one.</p>` : ""}`;
      }
      function renderAside(it) {
        const pr = it.prs.find((p) => p.ref === state.viewed) || null;
        const sess = pr ? pr.session : it.session;
        const sessState = pr ? pr.state : it.session.state;
        const sec = (title, body) => L >= 2
          ? `<details class="sec"><summary class="sec-head" aria-label="${esc(title)} details"><span class="kicker">${esc(title)}</span><span class="rotate" style="display:inline-flex;color:var(--muted-foreground)">${I.chevronDown(14)}</span></summary>${body}</details>`
          : `<section class="sec"><div class="sec-head"><span class="kicker">${esc(title)}</span></div>${body}</section>`;
        const ctl = `<section class="sec"><div class="sec-head"><span class="kicker">${pr ? "Controls · work item session" : "Controls"}</span></div>${controls(it, pr)}</section>`;
        return `<aside class="panel scroll-thin" aria-label="Session">
  <div class="panel-head"><span class="kicker">Session</span><button type="button" aria-label="Close panel" title="Close panel" data-act="close-aside">${I.panelRightClose(16)}</button></div>
  ${L >= 2 ? ctl : ""}
  ${sec("Harness", harnessRows(it, pr, sess, sessState))}
  ${sec("tmux", tmuxRows(sess))}
  ${sec(pr ? "Pull request" : "Ticket", ticketRows(it, pr))}
  ${L < 2 ? ctl : ""}
</aside>`;
      }
      function renderDetailsPop(it, pr, sess) {
        const sessState = pr ? pr.state : it.session.state;
        return `<details class="details-pop">
  <summary class="ibtn" aria-label="Session details" title="Session details">${I.info(16)}</summary>
  <div class="pop">
    <div class="sec"><div class="sec-head"><span class="kicker">Harness</span></div>${harnessRows(it, pr, sess, sessState)}</div>
    <div class="sec"><div class="sec-head"><span class="kicker">tmux</span></div>${tmuxRows(sess)}</div>
    <div class="sec"><div class="sec-head"><span class="kicker">${pr ? "Pull request" : "Ticket"}</span></div>${ticketRows(it, pr)}</div>
  </div>
</details>`;
      }

      /* — shell ————————————————————————————————— */
      function render() {
        const it = ITEMS.find((x) => x.ref === state.selected);
        const openPops = [...document.querySelectorAll("details[open]")].map((d) => d.className);
        document.getElementById("root").innerHTML = `<div class="app">
  <div class="demo" role="status"><span class="tag">Demo data</span><span class="text">These work items are a bundled fixture, not a live service — nothing here is real and no control verb leaves the browser.</span><button type="button" class="ctl">Connect to a service</button></div>
  <div class="shell">
    ${state.sidebarOpen ? renderSidebar() : ""}
    <main>${renderMain(it)}</main>
    ${L < 3 && state.asideOpen ? renderAside(it) : ""}
  </div>
</div>`;
        for (const cls of openPops) { const d = document.querySelector(`details[class="${cls}"]`); if (d) d.open = true; }
        document.title = `${it.title} · Option ${OPTION}`;
      }
      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-act]");
        if (!el) return;
        const act = el.dataset.act;
        if (act === "theme") {
          state.theme = state.theme === "dark" ? "light" : "dark";
          document.documentElement.classList.toggle("dark", state.theme === "dark");
          try { localStorage.setItem("the-loop:proto:theme", state.theme); } catch (_) {}
        } else if (act === "graph") state.graphOpen = !state.graphOpen;
        else if (act === "verbose") state.verbose = !state.verbose;
        else if (act === "search") state.searchOpen = !state.searchOpen;
        else if (act === "collapse-sidebar") state.sidebarOpen = false;
        else if (act === "open-sidebar") state.sidebarOpen = true;
        else if (act === "close-aside") state.asideOpen = false;
        else if (act === "open-aside") state.asideOpen = true;
        else if (act === "copy") {
          state.copied = el.dataset.key;
          try { navigator.clipboard.writeText(el.dataset.text); } catch (_) {}
          setTimeout(() => { state.copied = ""; render(); }, 1500);
        } else return;
        render();
        if (act === "search" && state.searchOpen) document.querySelector('[data-act="query"]')?.focus();
      });
      document.addEventListener("keydown", (e) => {
        const el = e.target.closest?.('[data-act="verbose"]');
        if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); state.verbose = !state.verbose; render(); }
      });
      document.addEventListener("input", (e) => {
        if (e.target.dataset?.act !== "query") return;
        state.query = e.target.value;
        const pos = e.target.selectionStart;
        render();
        const input = document.querySelector('[data-act="query"]');
        if (input) { input.focus(); input.setSelectionRange(pos, pos); }
      });
      window.addEventListener("hashchange", () => { readHash(); render(); });
      readHash();
      render();
    </script>
  </body>
</html>
