# yaml-language-server: $schema=https://raw.githubusercontent.com/MadaraUchiha-314/the-loop/main/.the-loop/harness-config.schema.json
# .the-loop/harness-config.yaml — HARNESS (plugin) configuration (per repo): the
# AGENT's file. The the-loop skill and the /the-loop:* commands read it; the CLI
# never does (issue-352, decision-123) — what the CLI needs (the spec directory,
# critics, graph hooks) is its own cli-config.yaml's, or a flag the agent passes.
# Generated by `/the-loop:init`. Validated against the-loop's own
# ${CLAUDE_PLUGIN_ROOT}/.the-loop/harness-config.schema.json — the schema ships WITH the
# plugin and is no longer copied into this repository (issue-220). The first line above
# points your editor at the published copy of that same schema; it is a comment, so
# deleting it costs completion-while-you-type and nothing else.
# The values below are the sensible-defaults baseline; init adjusts them per project
# via detection + the guided onboarding (the schema's x-onboarding groups; see the
# the-loop skill's reference/onboarding.md).
# A subset of these keys can be overridden per work-item in the YAML front-matter
# of the work-item / spec markdown.
# People live in .the-loop/collaborators.yaml. No ticketing system is named here:
# a work item's ticket is its ref. No phase labels either: they are `loop:<phase>`.
# The CLI daemon (gh-webhook/poll/sessions/events) is configured separately — it is
# not tied to this repo. See templates/cli-config.yaml and decision-032.

version: "0.3.0"

repository:
  monorepo: false         # the safe default: never assume a workspace tool exists
  monorepoTool: none      # nx | yarn | pnpm | bun | none
  runScriptsFromRoot: true

workflow:
  specDir: docs/specs                 # the CLI resolves the same directory from its own
                                      # routing.graph.specDir (default docs/specs) — move both
  capabilitiesDir: docs/capabilities  # living capability docs — organized view of specs; updated in the same PR (gate)
  learningsDir: docs/learnings        # the learnings tree (index + learning-<nnn>.md + topics/); move it if you publish docs/

tooling:
  languages: [ts]         # python | js | ts | go
  packageManager:
    python: uv
    ts: bun
    go: go
  unitTest:
    python: pytest
    ts: vitest
    go: go test
  integrationTest:
    python: pytest
    ts: playwright
    go: go test
  lint:
    python: ruff
    ts: oxlint
    go: golangci-lint
    markdown: markdownlint
  typeCheck:
    python: pyright
    ts: tsc
    go: go build
  release:
    ts: npm
    python: pypi
    go: go-modules
    containers: ghcr

customInstructions:             # user-provided instruction docs the harness reads before working
  docs: []                      # ordered; later docs win on conflict — reference/instructions.md
    # - path: docs/team-conventions.md        # repo-relative, or absolute for per-machine docs
    #   notes: House TS style, naming, PR etiquette.
  onMissing: warn               # warn | error | ignore — when a configured doc is absent

testing:
  gherkinDocstrings: required   # required | recommended | off — Gherkin docstring per integration test
  linkRequirements: true        # link the docstring to requirements.md when the test is tied to one
  integrationTestGlobs: []      # where `the-loop scenarios` looks (empty = CLI built-in defaults)

apiSpecs:
  rest:
    dir: specs/openapi          # RULE: all RESTful API specs authored here in OpenAPI format
    format: openapi-3.1         # openapi-3.1 | openapi-3.0
    generateDocs: true          # docs generated automatically from the OpenAPI specs
    docsTool: redocly           # free-form: redocly | widdershins | swagger-ui | …
  graphql:                      # best practice: SDL-first, checked in, snapshot-tested, documented
    dir: specs/graphql
    schemaFormat: sdl
    generateDocs: true
    docsTool: spectaql          # free-form: spectaql | graphdoc | magidoc | …

design:
  uiArtifacts:                  # UI/UX (visual) design in the design phase — reference/design-artifacts.md
    dir: design                 # docs/specs/<id>/design/ — checked-in html prototypes / figma exports
    format: html                # html | figma | both — how generated visual design is represented
    selfContained: true         # RULE: html prototypes inline all CSS/JS, no external network deps
    screenshotEvidence: true    # capture rendered screenshots of the locked design as evidence

hooks:
  preCommit: [lint, typecheck, unit-test]
  prePush: [lint, typecheck, unit-test]
  commitConvention: conventional-commits   # all commits follow Conventional Commits

# Hooks of your own on the process graph and the critic harnesses that review the
# work are the OPERATOR's, declared in cli-config.yaml (`routing.graph.hooks`,
# `critics[]`) — not here (issue-352, decision-123). See docs: /cli/hooks.

observability:
  devLevel: debug
  runtimeLevel: info
  browserLogging: chrome-devtools-mcp
  # eventLog lives in the CLI config (templates/cli-config.yaml), not here (decision-032)

reviews:
  selfReviewCount: 3              # cap; loop stops early on zero new findings
  criticReviewCount: 3
  stopOnNoNewFindings: true       # stop when a round finds nothing new actionable
  escalateOnRepeatFinding: true   # same finding twice in a row -> escalate to a human
  # WHICH critics exist is the operator's: `critics[]` in cli-config.yaml (issue-352).
  # `the-loop critic list` says what the machine running the round has.

# People live in .the-loop/collaborators.yaml (issue-82, decision-035). Nothing else
# is configured here: the risk tiers, the security gates, TDD, minimalism, the token
# economy, learnings, context management and the writing contract are the loop's
# fixed rules (issue-352), and the harness discovers its own tools.
# webhooks / polling / eventLog live in templates/cli-config.yaml (CLI config,
# not per-repo — decision-032).
