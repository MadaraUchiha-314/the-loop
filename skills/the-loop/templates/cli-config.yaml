# yaml-language-server: $schema=https://raw.githubusercontent.com/MadaraUchiha-314/the-loop/main/.the-loop/cli-config.schema.json
# the-loop CLI configuration (cli-config.yaml) — not tied to any one repo.
# Validated against ${CLAUDE_PLUGIN_ROOT}/.the-loop/cli-config.schema.json — the schema
# ships with the plugin rather than being copied next to this file (issue-220). The
# first line points your editor at the published copy of it.
#
# Read only by the CLI daemon (`the-loop gh-webhook`/`poll`/`sessions`/`events`),
# which is expected to work across multiple repos (decision-032). Resolved, in
# priority order:
#   1. --config / -c (explicit CLI flag)
#   2. $THE_LOOP_CLI_CONFIG (explicit env var, same priority as --config)
#   3. ./.the-loop/cli-config.yaml (repo-relative — track it in a specific
#      repo, e.g. a "dev box" repo, instead of your home directory)
#   4. ~/.the-loop/cli-config.yaml (the always-available fallback)
# Install this file at whichever of those paths suits your setup.
#
# See .the-loop/harness-config.yaml (generated by `/the-loop:init` per repo) for the
# PLUGIN config — ticketing, workflow, tooling, reviews, autonomy, security, …

version: "0.4.0"

# Everything the CLI GENERATES lives under this root (issue-106), organised by
# whether it travels between machines (issue-128, decision-046):
#   portable/  one record per work item — what an authorized user armed, and
#              which comments the poller has seen. THIS is the half to track in
#              git; see docs/cli/state.md for the .gitignore block.
#   local/     session handles (harness conversation id, cwd, tmux target).
#   logs/, gh-webhook.pid — this machine's trail and pid.
# It supplies DEFAULTS only — a path set explicitly below is used verbatim.
state:
  root: .the-loop

webhooks:
  ghWebhook:
    host: 127.0.0.1
    port: 8787
    path: /gh-webhook
    secretEnv: THE_LOOP_GH_WEBHOOK_SECRET   # env var holding the secret (not stored here)
    pidfile: .the-loop/gh-webhook.pid
    # Empty = the-loop's default set (every event it can route). If you narrow it,
    # keep `issues` and `pull_request`: without them a closed issue / merged PR
    # never arrives and its session is never closed — the receiver warns if so.
    events: []

# Pull-based, provider-agnostic ingress for hosts a webhook cannot reach
# (`the-loop poll start`). Each `sources` entry selects a provider the system
# interfaces with (github ships); discovered work drives the SAME routing/dispatch
# stack above (harness, spawn policy, templates, session registry) — so no
# duplicate session is ever spawned for the same work item. The core carries no
# provider-specific knobs; provider settings live under the source entry.
# What happens to an event ONCE ACCEPTED. Top-level since issue-142, and the
# nesting is the point: this block is NOT the receiver's. The poller reads
# every value here verbatim for dispatch, and `the-loop sessions` reads it
# again — one declaration governs both ingresses and the operator's own
# control surface. Only the listener itself (host/port/path/secret/pidfile)
# and the event filter are webhook-specific, and they stayed above.
routing:
  enabled: false                # route events to registered harness sessions
  registryDir: .the-loop/local        # machine-local session handles (issue-128)
  defaultHarness: claude        # claude | cursor
  spawnOnUnmatched: labeled     # never | always | labeled
  autoExecuteLabel: "the-loop: auto-execute"   # label that ARMS an issue/PR for autonomous execution
  # Execution control (issue-106): the label is necessary, NOT sufficient.
  # An authorized user starts/stops/pauses/resumes a work item by commenting
  # one of these keywords (or with `the-loop sessions start|stop|pause|
  # resume|cleanup`, which posts the same keyword back to the ticket). A comment
  # carrying a keyword is executed by the-loop, never forwarded to the agent.
  # Set requireStartCommand: false for the pre-issue-106 label-alone spawn.
  control:
    enabled: true
    requireStartCommand: true
    keywords:
      start: "the-loop start"
      stop: "the-loop stop"
      pause: "the-loop pause"
      resume: "the-loop resume"
      # DESTRUCTIVE (issue-186). Releases this work item's LOCAL resources —
      # every endpoint's tmux session, the workspace checkout (uncommitted work
      # in it is GONE) and the machine-local session record — ignoring the
      # keepSessionOnClose/keepCheckoutOnClose retention settings. Keeps the
      # portable record (control, poll, graph) and touches nothing remote.
      # A closure by an AUTHORIZED user does this on its own; a closure naming
      # no actor defers to this keyword. Set to "" to disable it.
      cleanup: "the-loop cleanup"
  # Where a session the daemon drives takes its ANSWERS from (issue-134).
  # Until this existed, a spawned session was never told whether a human was
  # at its terminal, so the model guessed — and both guesses fail: asking
  # interactively when nobody ever attaches to the tmux pane asks into a
  # void, while an operator sitting in an attached pane gets round-tripped
  # through GitHub for no reason.
  #   work-item  every question is a comment on the issue/PR; the session
  #              then waits, and the reply arrives as the next event.
  #   cli        a human is attached to this session's terminal; ask there.
  #              The decision's OUTCOME still lands on the ticket — the paper
  #              trail is not waived by asking in a terminal.
  # Default work-item because it fails safe: a tmux session is attachable,
  # not attended. An unrecognised value resolves to work-item with a warning,
  # never to cli. The resolved mode is rendered into every prompt through the
  # $interaction_directive placeholder; a custom promptTemplate that omits it
  # gets the directive APPENDED, so a template edit cannot strip the rule.
  # Independent of the mode, iteration on a generated artifact (brainstorm.md,
  # requirements.md/bugfix.md, design.md, tasks.md) always happens in
  # pull-request review — an invariant of the loop (decision-051).
  interaction:
    mode: work-item             # work-item | cli
  # Drive the-loop's PROCESS GRAPH from ingress events (issue-113). Without this,
  # the graph only moved when a human ran `the-loop graph advance`: a spawned
  # session left the work item's graph unentered (so the entry hooks never wrote
  # the `loop:<phase>` labels), and a reviewer's comment never reached the human
  # gate that was waiting for it. Best-effort — a graph failure is logged as
  # `graph.link_failed` and never costs the event delivery. The poller reuses this
  # same routing block, so both ingresses behave identically.
  graph:
    enabled: true               # false = pre-issue-113 behaviour
    # specDir: ""               # OPTIONAL OVERRIDE — leave unset. Each watched repo
                                # declares its own `workflow.specDir` (default
                                # `docs/specs`) in its harness config, which is the
                                # only thing that works when this one flat value
                                # would otherwise govern N repos (issue-123). Set it
                                # only for a checkout with no harness config at all.
  # SECURITY (prompt-injection guard): only these GitHub logins' actions are acted on
  # by BOTH the webhook receiver and the poller — the actor who DID the thing, so a
  # comment is judged by its own author. Comments/reviews/labels from anyone else are
  # ignored. On the poll path, an item opened by someone else is not *started* on its
  # own (a listing does not say who labelled it), but an authorized user's `the-loop
  # start`/`contribute` on it still works — decision-074. REQUIRED: no fallback to any
  # repo's plugin config — empty means human-authored events are all ignored (fail
  # closed). Run your own instance for your own login(s).
  authorizedUsers: []           # e.g. ["your-github-login"]
  spawnWorkdir: "."             # used only when workspace.root is unset (below)
  # Per-work-item checkout workspace (issue-76): when `root` is set, each event's
  # repo is checked out under the root and the spawned session runs there (instead
  # of spawnWorkdir), cleaned up when the PR merges/closes. Empty root => legacy
  # spawnWorkdir. Auth is your own git credentials (e.g. `gh auth setup-git`).
  workspace:
    root: ""                    # e.g. ~/.the-loop/workspace (empty = disabled)
    # worktree: shared clone per repo + a git worktree per work item (cheap, shares objects).
    # clone: one folder per work item with a full clone of each repo it touches
    #        (self-contained, simpler for multi-repo work items; a full clone per item).
    strategy: worktree          # worktree | clone
    cloneProtocol: https        # https | ssh
    defaultHost: github.com     # host dir when the payload has no html_url (set to your GHE domain)
    keepCheckoutOnClose: false  # keep the work item's checkout after PR close (for post-mortem)
    gitBinary: git
  maxConcurrentDispatches: 4
  dedupCacheSize: 1024
  dispatchTimeoutSeconds: 1800
  promptTemplate: skills/the-loop/templates/webhook-event-prompt.md          # internal template; dispatcher falls back to a built-in default when absent
  spawnPromptTemplate: skills/the-loop/templates/webhook-autoexecute-prompt.md  # internal template; dispatcher falls back to a built-in default when absent
  harnessArgs:
    claude: []                  # e.g. [--permission-mode, acceptEdits]
    cursor: []                  # e.g. [--force]
  # Pre-spawn harness preparation (issue-90). Claude Code's workspace-trust
  # dialog and bypass-permissions disclaimer are NOT permission rules, so no
  # flag (--dangerously-skip-permissions included) silences them — and every
  # per-work-item checkout is a new directory, so an unattended session used
  # to sit on a modal forever. Before each spawn the-loop marks that exact
  # directory trusted in your harness config (honouring CLAUDE_CONFIG_DIR),
  # merging into what's already there and writing nothing when it's already
  # set. acceptBypassPermissions: auto records the bypass disclaimer ONLY
  # when harnessArgs above already ask for bypass mode — the-loop never
  # widens permissions you didn't request. Set enabled: false to opt out.
  harnessTrust:
    enabled: true
    # The spawn dir itself is ALWAYS trusted (issue-136): the check that
    # decides whether the dialog appears for a repo shipping
    # .claude/settings.json grants reads the exact project key with no
    # ancestor walk, and neither does the onboarding key. scope only decides
    # whether trust ADDITIONALLY widens: workspace-root (default) writes a
    # second entry on workspace.root, so the harness's upward lookup covers
    # every checkout beneath it including folders the-loop never spawned
    # into; directory stops at the spawn dir (least privilege) — use it when
    # the root holds more than the-loop's checkouts. A root that doesn't
    # contain the spawn dir, or one as broad as / or $HOME, is dropped.
    scope: workspace-root           # workspace-root | directory
    acceptBypassPermissions: auto   # auto | always | never
  # Enable the-loop's OWN plugin before the session starts (issue-143): the
  # skill, the /the-loop:* commands and the SessionStart hook all ship in the
  # plugin, and nothing else in the spawn path installs it — so without this a
  # spawned session is told to run a loop it doesn't have. Writes
  # extraKnownMarketplaces["the-loop"] + enabledPlugins["the-loop@the-loop"]
  # into your harness's USER settings file, exactly what /plugin marketplace add
  # + /plugin install write, never touching a value that's already there. NOTE
  # that file is user-global: the plugin then loads in the Claude Code sessions
  # you start by hand too. enabled: false is the opt-out.
  harnessPlugins:
    enabled: true
    # owner/repo the marketplace is served from — point it at your fork to run
    # that fork's plugin (i.e. to run whatever code it ships). "" enables the
    # plugin without registering any marketplace.
    marketplaceRepo: "MadaraUchiha-314/the-loop"
  # Dispatch-lifecycle emoji reactions (issue-84): acknowledge on the triggering
  # comment (or the issue/PR itself) that the-loop started / completed / failed
  # processing an event. GitHub's palette is fixed (+1 -1 laugh confused heart
  # hooray rocket eyes) — ✅/⁉️ don't exist, so defaults are the closest match.
  # Best-effort via YOUR gh CLI (posts with your gh auth; default on — set
  # enabled: false to opt out); no-op when gh is absent, a state is "", or
  # the event has no reactable target.
  reactions:
    enabled: true
    started: eyes               # 👀 event dequeued for delivery/spawn
    completed: hooray           # 🎉 dispatch succeeded
    error: confused             # 😕 dispatch failed / worker crashed
  # Lifetime of the tmux-hosted sessions every dispatch runs in (issue-86).
  # A finished session stays readable: keepSessionOnClose leaves the tmux session
  # running when the work item closes, remainOnExit keeps the pane + scrollback
  # when the harness process exits. Retained sessions accumulate until you kill
  # them (`the-loop sessions list --status closed`); a new spawn for the same work
  # item reclaims the loop-<slug> name. Set either to false for the old behaviour.
  # resumeOnRespawn (issue-89): when a dead tmux session is respawned, continue
  # the SAME harness conversation (`claude --resume <id>`) so the agent keeps
  # what it knew about the work item, instead of booting a blank one. The
  # respawn is probed for resumeProbeSeconds (0 = check immediately) and falls
  # back to a fresh conversation when the harness could not resume.
  # killHarnessOnClose (issue-94): when the work item closes and its tmux
  # session is KEPT, end the harness process inside it — the pane stays
  # readable, but is no longer a live TUI a stray keystroke/paste could
  # resume. SIGTERM, then SIGKILL after harnessKillGraceSeconds.
  tmux:
    keepSessionOnClose: true
    remainOnExit: true
    resumeOnRespawn: true
    resumeProbeSeconds: 2
    killHarnessOnClose: true
    harnessKillGraceSeconds: 5
  # Session announcement comment (issue-86): when a tmux-mode session is spawned
  # for a work item, post the tmux session name and the `tmux attach -t …`
  # command on the work item, so a human on the ticket can watch it work. A
  # respawn posts nothing further (same name, same command). Best-effort via YOUR
  # gh CLI; no-op for non-GitHub work items or a missing gh. The body carries
  # no paths, session ids or hostnames.
  announce:
    enabled: true

polling:
  intervalSeconds: 60               # seconds between poll cycles (all sources)
  sources: []                       # e.g. the github source below (empty = nothing polled)
    # - provider: github
    #   repos: []                   # REQUIRED: OWNER/REPO list — no fallback to any
    #                               # repo's harness (plugin) config; a source with none discovers nothing
    #   monitor:
    #     issues: true
    #     pullRequests: true
    #   label: ""                   # empty = reuse routing.autoExecuteLabel above

# The control-plane API service (issue-161) — the HTTP layer the CLI, the MCP
# endpoint and the web dashboard all go through. Binding stays at its loopback
# default (`host: 127.0.0.1`, `port: 4114`, `exposed: false`); only the
# cross-origin block is spelled out, because it is the one you may want to
# change.
service:
  # Which browser ORIGINS may READ this service's responses (issue-211,
  # decision-077). Not a network setting: `host`/`exposed` decide who may
  # CONNECT, and nothing here widens that. The default entry is the origin
  # the-loop publishes its dashboard to
  # (https://madarauchiha-314.github.io/the-loop/ui/), so that page works
  # against your local service with no gateway in between — the cost being that
  # every Pages site under that same host shares the origin. Set
  # `allowOrigins: []` if you do not use the hosted dashboard; add your own
  # origin if you host a fork's copy of it.
  cors:
    allowOrigins: ["https://madarauchiha-314.github.io"]
    allowMethods: [GET, POST, OPTIONS]
    allowHeaders: [Accept, Content-Type]
    allowCredentials: false      # `true` with "*" above refuses to boot
    allowPrivateNetwork: true    # Chromium's public-page → loopback preflight

eventLog:                           # structured JSONL o11y trail; `the-loop events`
  enabled: true
  path: .the-loop/logs/events.jsonl

# The operator's own notification recipients (issue-82, decision-035) — the same
# collaborator structure as .the-loop/collaborators.schema.json, DECLARED here:
# the CLI daemon never reads any repo's collaborators.yaml. Typically just you.
collaborators: []
  # - handle: "@your-github-login"
  #   kind: individual
  #   roles: [engineer, approver]
  #   notifications:
  #     enabled: true
  #     channels:
  #       - type: slack             # only supported type for now
  #         enabled: true           # per-channel switch
  #         via: mcp                # mcp | cli | api — same primitives as externalTools.kind
  #         config:                 # channel-type-specific config
  #           channel-list: []      # slack: channels to notify, e.g. ["#the-loop-daemon"]

# Which DAEMON-side events notify which roles from `collaborators` above.
# Disjoint from the harness-side taxonomy in harness-config.yaml (decision
# pending, PR review, … — those are raised by the harness inside a repo).
notifications:
  enabled: true
  events: {}                        # event → roles; omitted event = nobody notified
    # work-item-spawned: [engineer]
    # dispatch-failed: [engineer]
    # session-died: [engineer]
    # event-dropped-unauthorized: [engineer]

# How the-loop's OWN calls reach external services (issue-109, decision-042).
# This governs the CONTROL PLANE only: what the AGENT does from inside its
# session is unconstrained — CLI, MCP, API, whatever the harness has.
#
# `auto` resolves in a documented order (a configured token, then an installed
# binary) and fails closed naming BOTH remedies. An explicit transport is
# honoured verbatim and fails rather than silently degrading, because a
# configured choice that quietly falls back is worse than an error.
integrations:
  github:
    transport: auto             # auto | api | cli
    api:
      tokenEnv: [GH_TOKEN, GITHUB_TOKEN]
      baseUrl: https://api.github.com
    cli:
      binary: gh                # inherits your `gh auth`, incl. enterprise/SSO
  slack:
    transport: sdk              # sdk (official slack-sdk, 0 deps) | webhook (raw POST)
    urlEnv: THE_LOOP_SLACK_WEBHOOK_URL
    # url: https://hooks.slack.com/services/XXX/YYY/ZZZ
    #   The URL itself, if you have judged it non-secret. Takes precedence over
    #   urlEnv, so reading this file tells you where a notification goes. It is
    #   still a bearer credential for that channel: setting it here commits it,
    #   and git history keeps it after you delete the line. Prefer urlEnv.
