# the-loop repo root — a uv workspace. the-loop declares `uv` as its Python package
# manager (`.the-loop/config.yaml` -> tooling.packageManager.python: uv), so it
# dogfoods uv here rather than raw pip. This root is a *virtual* workspace root (not a
# published package); it aggregates the `cli` member and the repo-level dev tooling.
# Reproducibility (RULE: no local-vs-CI drift) comes from the committed `uv.lock`.
[tool.uv.workspace]
members = ["cli"]

[dependency-groups]
dev = [
    "ruff==0.15.8",
    "pyright",
    "pytest>=8",
    "pre-commit",
    "commitizen>=3",
    "jsonschema",
    "pyyaml",
    # the control-plane service extra + its test client (issue-161): CI and the
    # dev env host the API service, so the [service] deps are dev tooling here.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

# Test modules import shared doubles from their sibling conftest.py (pytest puts
# the tests directory on sys.path); tell pyright the same thing.
[tool.pyright]
executionEnvironments = [{ root = "cli/tests", extraPaths = ["cli/tests"] }]
