name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 matches the local dev environment (markdownlint runs under it).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Install uv (the-loop's declared Python package manager), then `uv sync` the
      # workspace from uv.lock. RULE: no local-vs-CI tooling drift — the same pinned
      # versions run locally and here, uv itself included: an unpinned runner re-resolves
      # the lockfile's text differently as new uv versions ship, which `--locked` below
      # would then report as drift. The pin sits inside the window `pyproject.toml`'s
      # `required-version` enforces on developer machines.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
          python-version: "3.11"

      # `--locked` FAILS on a stale lockfile instead of quietly rewriting it in the
      # runner. A bare `uv sync` re-locks in place and throws the result away, so a
      # lockfile that had fallen behind the versions it locks sailed through every PR
      # and was only noticed as a dirty tree on someone's machine (issue-407).
      - name: Sync workspace (uv.lock, must be up to date)
        run: uv sync --locked

      # Run the SAME pre-commit hooks the developer runs locally, via uv.
      - name: Run pre-commit (lint, format, type-check, markdownlint, tests, schema)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # Structural invariant: the repo tree matches the manifest's knowledge files.
      - name: Validate JSON artifacts parse
        run: |
          uv run python -c "import json; [json.load(open(p)) for p in ['.claude-plugin/plugin.json', '.claude-plugin/marketplace.json', '.cursor-plugin/plugin.json', '.cursor-plugin/marketplace.json', '.the-loop/harness-config.schema.json', '.the-loop/collaborators.schema.json', 'hooks/hooks.json']]; print('json ok')"

  # The control-plane dashboard (ui/). Its own toolchain — bun, oxlint, vitest —
  # so it stays out of the pre-commit hooks, which are uv-resolved by design.
  # Same three commands the Pages workflow runs before it publishes.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (oxlint, type-aware)
        run: bun run lint

      - name: Test (vitest)
        run: bun run test

      # `build` runs `tsc --noEmit` first, so this covers the type check too.
      - name: Build
        run: bun run build
