# Release — semantic, automated versioning + PyPI publish on merge to main.
#
# Versioning is derived from Conventional Commits (which, with squash-merge, is the PR
# title): feat -> minor, fix -> patch, `BREAKING CHANGE`/`!` -> major. On every push to
# main, `cz bump` (commitizen — the tool the-loop already uses, decision-008) computes the
# next version from the commits since the last tag, rewrites the version in `.cz.toml` and
# `cli/pyproject.toml` (version_files), commits `bump: …`, and tags `v<version>`. The tag +
# commit are pushed back to main, a GitHub Release is cut, and the built distribution is
# published to PyPI. If no commit since the last tag warrants a release, the run is a no-op.
#
# Publishing uses PyPI **Trusted Publishing** (GitHub Actions OIDC) — no stored token. PyPI
# trusts this exact workflow: project `the-loopy-one`, owner/repo `MadaraUchiha-314/the-loop`,
# workflow `release.yml`, environment `pypi`. See docs/decisions/decision-019.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two releases at once (they would race on the tag / main push).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version bump + build
    runs-on: ubuntu-latest
    # Skip the run the workflow triggers on itself when it pushes the `bump:` commit —
    # that commit carries no releasable change, so re-entering would be wasted work.
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    permissions:
      contents: write        # push the bump commit + tag back to main, and cut the Release
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # commitizen needs full history to read commits since the last tag
          token: ${{ secrets.GITHUB_TOKEN }}

      # Same uv setup as CI (.github/workflows/ci.yml) — RULE: no local-vs-CI drift.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # First-release bootstrap: with no release tag yet, `cz bump` would scan the whole
      # history and over-count the increment. Instead, treat the version currently in the
      # repo as already-released by tagging it on the PREVIOUS commit (HEAD^), so the bump
      # is computed only from the commits merged since. The tag is LOCAL-ONLY and never
      # pushed: `cz bump` reads it from the runner's checkout, and pushing a tag that points
      # at an older commit whose `.github/workflows/` differs from the branch tip is rejected
      # for GITHUB_TOKEN ("refusing to allow a GitHub App to create or update workflow …
      # without `workflows` permission"). The real `v<next>` tag created at the bump commit
      # (below) matches the tip's workflow files, so it pushes fine. Guarded by "no v* tag
      # exists", so it runs exactly once — later runs fetch the real remote tags.
      - name: Bootstrap baseline tag (first release only, local-only)
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            base="v$(uv run cz version --project)"
            git tag "$base" "HEAD^"   # LOCAL ONLY — do not push (see comment above)
            echo "Seeded local baseline ${base} at $(git rev-parse --short 'HEAD^') for increment computation."
          fi

      # Compute + apply the version bump. commitizen exits 21 (NoneIncrementExit) or 3
      # (NoCommitsFoundError) when nothing warrants a release — treated as a clean no-op.
      - name: Bump version (commitizen)
        id: bump
        run: |
          set +e
          out="$(uv run cz bump --yes --changelog 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            version="$(uv run cz version --project)"
            echo "released=true"          >> "$GITHUB_OUTPUT"
            echo "version=${version}"      >> "$GITHUB_OUTPUT"
            echo "Bumped to ${version}"
          elif [ "$code" -eq 21 ] || [ "$code" -eq 3 ]; then
            echo "released=false"          >> "$GITHUB_OUTPUT"
            echo "No releasable commits since the last tag — skipping publish."
          else
            echo "::error::cz bump failed (exit ${code})"
            exit "$code"
          fi

      # Push the bump commit and its tag together. NOTE: `git push --follow-tags` only
      # pushes *annotated* tags, but commitizen creates a *lightweight* tag — so the tag
      # must be pushed explicitly by ref, or `gh release create --verify-tag` (below) can't
      # find it on the remote and the release/publish fails.
      - name: Push bump commit + tag to main
        if: steps.bump.outputs.released == 'true'
        run: git push origin "HEAD:refs/heads/main" "refs/tags/v${{ steps.bump.outputs.version }}"

      - name: Build distribution
        if: steps.bump.outputs.released == 'true'
        run: uv build --package the-loopy-one

      - name: Create GitHub Release
        if: steps.bump.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes --verify-tag

      - name: Upload dist artifacts
        if: steps.bump.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/the-loopy-one/
    permissions:
      # OIDC token for Trusted Publishing — the ONLY credential this job needs.
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-container:
    name: Publish the container image to GHCR
    needs: release
    # The same gate `publish-pypi` carries: a no-op release publishes neither artifact,
    # so a `:12.0.0` tag on the registry and `the-loopy-one==12.0.0` on PyPI are always
    # the same commit (issue-236, R4.2).
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io/<this repo> — the workflow's own token
      id-token: write        # OIDC for the provenance attestation
      attestations: write
    env:
      # Lowercase, because a registry reference must be: `github.repository` carries the
      # owner's display casing.
      IMAGE: ghcr.io/madarauchiha-314/the-loop
    steps:
      # The release job has already pushed `v<version>`, and its `cli/pyproject.toml`
      # carries the bumped version — so the image installs the released code, and
      # `/api/v1/health` reports the version this job tagged it with.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: docker/setup-qemu-action@v3     # arm64 under emulation; the deps are wheels

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `type=semver,value=` supplies the version explicitly: this job is triggered by a
      # push to main, so the git ref metadata-action would otherwise read is `main`.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # What makes the published image checkable against this workflow run — the
      # registry-side equivalent of PyPI's Trusted Publishing (decision-019).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
