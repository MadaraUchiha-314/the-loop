# yaml-language-server: $schema=./collaborators.schema.json
# .the-loop/collaborators.yaml — collaborators for the-loop's own repository.
# Validated against .the-loop/collaborators.schema.json. The single source of
# truth for WHO collaborates on this project and in which ROLES (issue-82,
# decision-035); migrated from harness-config.yaml's retired `personas`/
# `messaging` keys. Which events concern which roles is configured in
# harness-config.yaml (notifications.events).
#
# No delivery is declared here (issue-304). A notification goes to a channel —
# `channels.slack` in the CLI config, one bot for the whole daemon, subscribed
# to events by name. Per-person routing is not built.

version: "0.2.0"

collaborators:
  - handle: "@MadaraUchiha-314"
    kind: individual
    roles: [product-manager, architect, engineer, approver]
