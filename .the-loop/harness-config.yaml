# yaml-language-server: $schema=./harness-config.schema.json
# .the-loop/harness-config.yaml — HARNESS (plugin) configuration for the-loop's
# own repository (installed here as a Claude/Cursor plugin). Validated against
# .the-loop/harness-config.schema.json. THE AGENT'S FILE: the skill and the
# /the-loop:* commands read it, and the CLI never does (issue-352, decision-123) —
# what the CLI needs lives in .the-loop/cli-config.yaml (spec directory, critics,
# graph hooks) or arrives as a flag the agent passes. People live in
# .the-loop/collaborators.yaml; this file names no ticketing system (the work
# item's ref says which repository) and no phase labels (they are `loop:<phase>`).

version: "0.3.0"

repository:
  monorepo: false          # the-loop itself is not (yet) a monorepo
  monorepoTool: none
  runScriptsFromRoot: true

workflow:
  specDir: docs/specs                  # the CLI's routing.graph.specDir must agree (issue-352)
  capabilitiesDir: docs/capabilities   # living capability docs — the organized view of specs (issue-25)
  learningsDir: docs/learnings         # issue-224: stated, not defaulted — the learnings sit with every other doc the loop maintains

tooling:
  languages: [python]      # the-loop itself: a Python CLI + markdown docs
  packageManager:
    python: uv
  unitTest:
    python: pytest
  integrationTest:
    python: pytest
  lint:
    python: ruff
    markdown: markdownlint
  typeCheck:
    python: pyright
  release:
    python: pypi
    containers: ghcr

customInstructions:             # user-provided instruction docs the harness reads before working
  docs: []                      # the-loop's own conventions live in the skill itself; none extra
    # - path: docs/team-conventions.md        # repo-relative, or absolute for per-machine docs
    #   notes: House TS style, naming, PR etiquette.
  onMissing: warn               # warn | error | ignore — when a configured doc is absent

testing:
  gherkinDocstrings: required   # integration tests get a Gherkin docstring
  linkRequirements: true
  integrationTestGlobs:
    - cli/tests/test_*_integration.py   # webhook→session routing scenarios (issue-15)
apiSpecs:                       # the-loop's own control-plane API (issue-161)
  rest:
    # Overrides the shipped default (`specs/openapi`): this repo keeps its API
    # contract inside the docs tree, and `docs/specs/` already means per-work-item
    # specs — hence `api-specs` (owner decision, PR #162).
    dir: docs/api-specs/openapi
    format: openapi-3.1
    generateDocs: true

design:
  uiArtifacts:                  # UI/UX (visual) design artifacts — see reference/design-artifacts.md
    dir: design                 # docs/specs/<id>/design/ — checked-in html prototypes / figma exports
    format: html                # html | figma | both (the-loop itself has no product UI)
    selfContained: true         # RULE: html prototypes inline all CSS/JS, no external network deps
    screenshotEvidence: true    # capture rendered screenshots of the locked design as evidence

hooks:
  preCommit: [lint, typecheck, unit-test]
  prePush: [lint, typecheck, unit-test]
  commitConvention: conventional-commits

observability:
  devLevel: debug
  runtimeLevel: info
  browserLogging: chrome-devtools-mcp
  # eventLog moved to .the-loop/cli-config.yaml (CLI config, decision-032)

reviews:
  selfReviewCount: 3
  criticReviewCount: 3
  stopOnNoNewFindings: true       # stop the loop when a round finds nothing new
  escalateOnRepeatFinding: true   # same finding twice in a row -> escalate to a human
  # WHICH critics exist is the operator's: `critics[]` in .the-loop/cli-config.yaml
  # (issue-352, decision-123). `the-loop critic list` says what this machine has.

autonomy:
  defaultTier: 3                  # 1-Trivial … 5-Critical
  inferFromChange: true
  sensitivePaths:
    - "**/*schema*"
    - ".the-loop/harness-config.schema.json"
    - ".the-loop/harness-config.yaml"   # the agent's policy: autonomy tiers, security gates
    - ".the-loop/cli-config.yaml"       # critics[] and routing.graph.hooks are executable config
    - ".github/workflows/**"
  tiers:
    "1": autonomous-complete
    "2": autonomous-complete
    "3": human-approves-pr
    "4": human-approves-pr
    "5": human-approves-spec-and-pr

security:                         # security woven into the phase gates (reference/security.md)
  threatModel:
    required: true                # requirements/bugfix carry a Security considerations section
    projectDoc: ""                # optional living threat-model doc (empty = per-work-item sections only)
  design:
    required: true                # design.md enforces every trust boundary from the requirements
  review:
    required: true                # ready-to-ship gate: a security review must pass
    mechanism: auto               # auto = built-in security-review skill when available, else the checklist | skill | checklist
    humanSignOffMinTier: 4        # risk tier >= this needs a named human security sign-off (6 = never)

tdd:
  mode: standard                  # standard | tdd-first | off

minimalism:
  enabled: true
  intensity: standard             # low | standard | high

tokenEconomy:                     # token/cost levers (issue-37) — advisory, never a gate.
  enabled: true                   # See reference/token-economy.md. Tier→model ids left empty:
  modelRouting:                   # the-loop dogfoods on whatever model the operator runs.
    enabled: true
    tiers:
      economy:  {}
      standard: {}
      frontier: {}
    stages:
      brainstorm: frontier
      requirements: frontier
      design: frontier
      test-planning: standard
      tasks: standard
      implementation: standard
      verification: standard
      self-review: standard
      critic-review: frontier
      evidence: economy
      capability-docs: economy
      reviewer-briefing: economy
      status: economy
      learnings: economy
    riskTierFloor:
      "4": standard
      "5": frontier
  thinkingEffort:
    enabled: true
    stages:
      design: high
      critic-review: high
      test-planning: medium
      implementation: medium
      verification: low
      capability-docs: low
      reviewer-briefing: low
      evidence: none
      status: none
  outputVerbosity:
    mode: concise
    preserve: [code, commands, diffs, errors, paper-trail-comments, reviewer-briefing, specs, decisions, capability-docs]
  progressiveDisclosure:
    enabled: true
    phaseScoped: true
  subAgentDelegation:
    enabled: true
  compaction:
    enabled: true
  telemetry:
    enabled: true

selfImprovement:
  enabled: true
  maxIndexLines: 200
  writeGateOccurrences: 3

contextManagement:               # checkpoint-then-reset — see reference/context.md
  enabled: true
  phaseBoundary: clear           # locked spec → fresh window for implementation (plan-mode style)
  taskBoundary: compact          # after each completed task: checkpoint, then compact
  midTask: compact               # never clear mid-task; compact only, after a checkpoint

userInteraction:
  diagramFormat: mermaid          # RULE: all diagrams are mermaid
  prSummary:
    required: true                # gate: post the briefing BEFORE requesting human review
    templatePath: skills/the-loop/templates/pr-briefing.md   # the-loop's internal template (under ${CLAUDE_PLUGIN_ROOT})
    condensed: true               # tell the reviewer where to focus, and in what order
    includeDiagrams: true         # mermaid diagrams explaining the low-level details
    documentInsightsAndDecisions: true
  educateUser: true               # mandatory, not optional
  writingStyle:                   # how the artifacts a HUMAN reads are written (issue-165)
    enabled: true                 # judgement lives in the bundled `the-loop:writing` skill
    skill: the-loop:writing
    diagramFirst: true            # RULE: 3+ named parts -> draw it, don't describe it
    # No length limits, on purpose (PR #168, decision-061): scope is not known in
    # advance, so any number is wrong for half the work items. The skill's test is
    # density, not word count — and that is a review judgement, never a gate.
    formalRegisters:              # never relaxed into informal prose — these are contracts
      - ears-acceptance-criteria
      - abuse-cases
      - api-contracts
      - schema-descriptions
      - rfc-2119

# People live in .the-loop/collaborators.yaml (issue-82, decision-035). Which events
# reach a channel is the CLI config's `channels.<name>.subscribe` (issue-309); no
# event → role filter lives here since issue-352.

externalTools:                    # inline registry — one YAML for easy onboarding (issue-37)
  tools:
    - name: github
      kind: mcp
      notes: GitHub issues/PRs/Actions via MCP.
    - name: the-loop
      kind: plugin
      notes: This plugin.
    - name: caveman
      kind: skill
      url: https://github.com/JuliusBrussee/caveman
      notes: >-
        Output-token compression (drops narration filler; never touches
        code/commands/errors). the-loop expresses this natively via
        tokenEconomy.outputVerbosity — install if you prefer the packaged skill.
        Its preservation rules must not compress the reviewer briefing or
        paper-trail comments. (issue-37)
    - name: ponytail
      kind: skill
      url: https://github.com/DietrichGebert/ponytail
      notes: >-
        Generation-minimalism decision ladder (YAGNI → reuse → stdlib → native →
        dep → one-liner). the-loop expresses this natively via
        reference/minimalism.md / config.minimalism — install if you prefer the
        packaged skill. (issue-37)
    - name: avoid-ai-writing
      kind: skill
      url: https://github.com/conorbronsdon/avoid-ai-writing
      notes: >-
        Audits 21 categories of machine writing in 7 buckets, severity-tiered
        P0/P1/P2, modes detect/rewrite/edit. the-loop takes its tiering and its
        detect-before-rewrite order into the bundled `the-loop:writing` skill,
        and its own warning about false positives (>60% on non-native speakers)
        is why our mechanical check asserts P0 tells only. Its word-tier
        ban-lists are deliberately NOT adopted. (issue-165, decision-062)
    - name: anti-ai-slop-writing
      kind: skill
      url: https://github.com/jalaalrd/anti-ai-slop-writing
      notes: >-
        50+ flagged words, 35+ phrases, 16 banned openers plus structural rules,
        shipped as a short core file with a separate vocabulary reference —
        the two-file shape `the-loop:writing` uses (SKILL.md + reference/tells.md).
        Vocabulary bans not adopted. (issue-165, decision-062)
    - name: stop-slop
      kind: skill
      url: https://mcpmarket.com/tools/skills/stop-slop
      notes: >-
        Editor pass that cuts filler, jargon and throat-clearing openers while
        preserving voice. Overlaps the two above; registered for operators who
        prefer a packaged editor. (issue-165, decision-062)
  notes: >-
    caveman, ponytail and the three writing skills are registered, not vendored —
    the-loop implements their techniques natively (tokenEconomy / minimalism /
    the bundled `the-loop:writing` skill) and bundles no runtime
    (decision-005, decision-062). Register-only: the harness may use them if installed.
