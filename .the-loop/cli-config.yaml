# yaml-language-server: $schema=./cli-config.schema.json
# .the-loop/cli-config.yaml — the-loop's own CLI-daemon config, checked in for
# local dev/dogfooding. Validated against .the-loop/cli-config.schema.json.
#
# The daemon (gh-webhook / poll / sessions / events) is not tied to any one
# repo checkout (decision-032), so this file isn't required to live here — but
# it CAN: an operator may choose to track their CLI config in a specific repo
# (e.g. this one) instead of their home directory. Resolution order:
#   1. --config / -c (explicit CLI flag)
#   2. $THE_LOOP_CLI_CONFIG (explicit env var, same priority as --config)
#   3. ./.the-loop/cli-config.yaml (repo-relative — this file, picked up
#      automatically when `the-loop <command>` is run from this checkout)
#   4. ~/.the-loop/cli-config.yaml (the always-available fallback)
#
# See .the-loop/config.yaml for the-loop's own PLUGIN config (ticketing,
# workflow, tooling, reviews, …).

version: "0.7.0"

# Everything the CLI GENERATES lives under this root (issue-106), organised by
# whether it travels between machines (issue-128, decision-046):
#   portable/  one record per work item — what an authorized user armed, and
#              which comments the poller has seen. THIS is the half to track in
#              git; see docs/cli/state.md for the .gitignore block.
#   local/     session handles (harness conversation id, cwd, tmux target).
#   logs/, gh-webhook.pid — this machine's trail and pid.
# It supplies DEFAULTS only — a path set explicitly below is used verbatim.
state:
  root: .the-loop

webhooks:
  ghWebhook:
    host: 127.0.0.1
    port: 8787
    path: /gh-webhook
    secretEnv: THE_LOOP_GH_WEBHOOK_SECRET
    pidfile: .the-loop/gh-webhook.pid
    events: [issues, issue_comment, pull_request, pull_request_review, pull_request_review_comment, workflow_run]

# What happens to an event ONCE ACCEPTED. Top-level since issue-142, and the
# nesting is the point: this block is NOT the receiver's. The poller reads
# every value here verbatim for dispatch, and `the-loop sessions` reads it
# again — one declaration governs both ingresses and the operator's own
# control surface. Only the listener itself (host/port/path/secret/pidfile)
# and the event filter are webhook-specific, and they stayed above.
routing:
  enabled: false                # flip on to route events to registered sessions
  registryDir: .the-loop/local        # machine-local session handles (issue-128)
  defaultHarness: claude        # claude | cursor
  spawnOnUnmatched: labeled     # never | always | labeled
  autoExecuteLabel: "the-loop: auto-execute"   # label that ARMS an issue/PR for autonomous execution
  # Execution control (issue-106): the label is necessary, not sufficient.
  # An authorized user starts/stops/pauses/resumes a work item by commenting
  # one of these keywords (or with `the-loop sessions start|stop|pause|
  # resume`, which posts the same keyword back to the ticket). A comment
  # carrying a keyword is executed by the-loop, never forwarded to the agent.
  # Set requireStartCommand: false for the pre-issue-106 label-alone spawn.
  # EVERY declared keyword is spelled out below, at its default, in the order
  # the docs use. Omitted keys take their defaults, so this block was behaving
  # identically when it listed only the first four — but a keyword this file
  # does not name is one an operator reading it does not know exists, and seven
  # had accumulated that way (PR #308 review). The vocabulary is the daemon's
  # control surface: it belongs in the config that declares the daemon.
  control:
    enabled: true
    requireStartCommand: true
    keywords:
      start: "the-loop start"
      stop: "the-loop stop"
      pause: "the-loop pause"
      resume: "the-loop resume"
      # Answers the graph's phase-selection gate and freezes the choice
      # (issue-177) — it touches no session, so it neither arms nor disarms.
      execute: "the-loop execute"
      # Arm as `start` AND select the outer loop this item walks: the
      # CONTRIBUTION loop (issue-185, joins an in-progress item as a guest),
      # the AD-HOC loop (issue-225, no PDLC process at all), or the REVIEW
      # loop (issue-279, the-loop reviews a PR and changes no code).
      contribute: "the-loop contribute"
      do: "the-loop do"
      review: "the-loop review"
      # DESTRUCTIVE (issue-186): releases this work item's LOCAL resources —
      # every endpoint's tmux session, the workspace checkout (uncommitted work
      # in it is GONE), the machine-local record. Keeps the portable record.
      cleanup: "the-loop cleanup"
      # WORK-ITEM COLLABORATORS (issue-307): grant a login the right to be
      # INPUT on THIS work item — their comments reach its session — and
      # nothing else. A collaborator cannot command the-loop (these two
      # included, so no transitive grant), cannot arm or spawn a session, and
      # cannot answer a human gate; those keep reading authorizedUsers alone.
      add-collaborator: "the-loop add-collaborator"
      remove-collaborator: "the-loop remove-collaborator"
  # Where a session the daemon drives takes its ANSWERS from (issue-134).
  # Until this existed, a spawned session was never told whether a human was
  # at its terminal, so the model guessed — and both guesses fail: asking
  # interactively when nobody ever attaches to the tmux pane asks into a
  # void, while an operator sitting in an attached pane gets round-tripped
  # through GitHub for no reason.
  #   work-item  every question is a comment on the issue/PR; the session
  #              then waits, and the reply arrives as the next event.
  #   cli        a human is attached to this session's terminal; ask there.
  #              The decision's OUTCOME still lands on the ticket — the paper
  #              trail is not waived by asking in a terminal.
  # Default work-item because it fails safe: a tmux session is attachable,
  # not attended. An unrecognised value resolves to work-item with a warning,
  # never to cli. The resolved mode is rendered into every prompt through the
  # $interaction_directive placeholder; a custom promptTemplate that omits it
  # gets the directive APPENDED, so a template edit cannot strip the rule.
  # Independent of the mode, iteration on a generated artifact (brainstorm.md,
  # requirements.md/bugfix.md, design.md, tasks.md) always happens in
  # pull-request review — an invariant of the loop (decision-051).
  interaction:
    mode: work-item             # work-item | cli
  # SECURITY: no fallback to this repo's plugin config (issue-63 review) —
  # empty here means nothing human-authored is actioned (fail closed).
  # Set this explicitly, e.g. ["MadaraUchiha-314"], to actually route events.
  # Each entry is one PERSON, declared once with their id on every channel
  # they act on (issue-309, decision-103): a bare string is a GitHub login; a
  # mapping names the channel ids — `github:` is what both ingresses and the
  # graph's human gates read, `slack:` the MEMBER id (U…) the Slack channel
  # reads. `channels.slack.authorizedUsers` is gone: one list, read per channel.
  authorizedUsers: []
  # - github: MadaraUchiha-314
  #   slack: U0123456789
  spawnWorkdir: "."             # used only when workspace.root is unset (below)
  # Per-work-item checkout workspace (issue-76): set `root` to check out each event's
  # repo under it and run the spawned session there, cleaned up on PR merge/close.
  # Empty = legacy spawnWorkdir. strategy: worktree (shared clone + per-item worktree)
  # or clone (one folder per work item, full clone of each repo it touches).
  workspace:
    root: ""                    # e.g. ~/.the-loop/workspace (empty = disabled)
    strategy: worktree          # worktree | clone
    cloneProtocol: https        # https | ssh
    defaultHost: github.com     # host dir when the payload has no html_url (set to your GHE domain)
    keepCheckoutOnClose: false  # keep the work item's checkout after PR close (for post-mortem)
    gitBinary: git
  # Sessions are hosted in attachable tmux sessions (loop-<slug>) — the only
  # runner (issue-32, issue-156, decision-056).
  # Lifetime of the tmux-hosted sessions (issue-86): a finished session stays
  # readable. keepSessionOnClose leaves the tmux session running when the work
  # item closes (PR merged/closed or `sessions close`); remainOnExit keeps the
  # pane + scrollback when the harness process itself exits. Retained sessions
  # accumulate — `the-loop sessions list --status closed` shows them, and a new
  # spawn for the same work item reclaims the loop-<slug> name.
  # resumeOnRespawn (issue-89) makes a respawn of a dead session continue the
  # SAME harness conversation (claude --resume <id>) instead of booting blank;
  # the spawn is probed for resumeProbeSeconds and falls back to a fresh
  # conversation if the harness could not resume (0 = probe immediately).
  # killHarnessOnClose (issue-94) ends the harness process inside a RETAINED
  # session when the work item closes, so the pane stays readable but is no
  # longer a live TUI stray input could resume (SIGTERM, then SIGKILL after
  # harnessKillGraceSeconds).
  # sessionPerPr (issue-172, issue-253, issue-258, issue-260) is the operator
  # DEFAULT for how many tmux+claude sessions a work item's pull requests get.
  # The CHOICE is the work item's, made at phase-selection (the pr-sessions-*
  # checklist rows, with this value pre-ticked) and frozen by an authorized
  # `the-loop execute`; this line answers for a work item that left them alone.
  #   never             every PR's events go into the work item's single session.
  #   cross-repository  (default) only a PR in ANOTHER repository gets its own —
  #                     a PR in the work item's own repository is that item's own
  #                     delivery, on its branch, in its checkout.
  #   always            every PR gets its own, the work item's repository too.
  # In EVERY mode an endpoint spawns only when it has a working tree of its own
  # (decision-088 D2), so `always` needs workspace.root set and, in practice,
  # strategy: clone — two git worktrees of one clone cannot both hold the PR's
  # branch. A refusal is delivered into the work item's session and recorded as
  # session.pr_session_declined. The legacy booleans still parse: true is
  # cross-repository, false is never; anything unrecognised warns and resolves
  # to cross-repository. Left at the shipped value here: this repository's
  # workspace is unset, so `always` would decline every time — for a work item
  # that selects it as much as for a default that states it.
  tmux:
    keepSessionOnClose: true
    remainOnExit: true
    resumeOnRespawn: true
    resumeProbeSeconds: 2
    killHarnessOnClose: true
    harnessKillGraceSeconds: 5
    sessionPerPr: cross-repository
  webTerminal:                # ttyd browser terminal onto the tmux sessions
    enabled: false            # access control is environmental: localhost/VPN/provider (decision-021)
    host: 127.0.0.1
    port: 7681
  maxConcurrentDispatches: 4
  dedupCacheSize: 1024
  dispatchTimeoutSeconds: 1800
  promptTemplate: skills/the-loop/templates/webhook-event-prompt.md          # internal template; dispatcher falls back to a built-in default when absent
  spawnPromptTemplate: skills/the-loop/templates/webhook-autoexecute-prompt.md  # internal template; dispatcher falls back to a built-in default when absent
  harnessArgs:
    claude: []                  # e.g. [--permission-mode, acceptEdits]
    cursor: []                  # e.g. [--force]
  # Pre-spawn harness preparation (issue-90). Claude Code's workspace-trust
  # dialog and bypass-permissions disclaimer are NOT permission rules, so no
  # flag (--dangerously-skip-permissions included) silences them — and every
  # per-work-item checkout is a new directory, so an unattended session used
  # to sit on a modal forever. Before each spawn the-loop marks that exact
  # directory trusted in your harness config (honouring CLAUDE_CONFIG_DIR),
  # merging into what's already there and writing nothing when it's already
  # set. acceptBypassPermissions: auto records the bypass disclaimer ONLY
  # when harnessArgs above already ask for bypass mode — the-loop never
  # widens permissions you didn't request. Set enabled: false to opt out.
  harnessTrust:
    enabled: true
    # The spawn dir itself is ALWAYS trusted (issue-136): the check that
    # decides whether the dialog appears for a repo shipping
    # .claude/settings.json grants reads the exact project key with no
    # ancestor walk, and neither does the onboarding key. scope only decides
    # whether trust ADDITIONALLY widens: workspace-root (default) writes a
    # second entry on workspace.root, so the harness's upward lookup covers
    # every checkout beneath it including folders the-loop never spawned
    # into; directory stops at the spawn dir (least privilege) — use it when
    # the root holds more than the-loop's checkouts. A root that doesn't
    # contain the spawn dir, or one as broad as / or $HOME, is dropped.
    scope: workspace-root           # workspace-root | directory
    acceptBypassPermissions: auto   # auto | always | never
  # Enable the-loop's OWN plugin before the session starts (issue-143): the
  # skill, the /the-loop:* commands and the SessionStart hook all ship in the
  # plugin, and nothing else in the spawn path installs it — so without this a
  # spawned session is told to run a loop it doesn't have. Writes
  # extraKnownMarketplaces["the-loop"] + enabledPlugins["the-loop@the-loop"]
  # into your harness's USER settings file, exactly what /plugin marketplace add
  # + /plugin install write, never touching a value that's already there. NOTE
  # that file is user-global: the plugin then loads in the Claude Code sessions
  # you start by hand too. enabled: false is the opt-out.
  harnessPlugins:
    enabled: true
    # owner/repo the marketplace is served from — point it at your fork to run
    # that fork's plugin (i.e. to run whatever code it ships). "" enables the
    # plugin without registering any marketplace.
    marketplaceRepo: "MadaraUchiha-314/the-loop"
  # Dispatch-lifecycle emoji reactions (issue-84): acknowledge on the triggering
  # comment (or the issue/PR itself) that the-loop started / completed / failed
  # processing an event. GitHub's palette is fixed (+1 -1 laugh confused heart
  # hooray rocket eyes) — ✅/⁉️ don't exist, so defaults are the closest match.
  # Best-effort via the operator's gh CLI; no-op when gh is absent, a state is
  # "", or the event has no reactable GitHub target. Default true (owner
  # decision, PR #85); posts with YOUR gh auth — set enabled: false to opt out.
  reactions:
    enabled: true
    started: eyes               # 👀 event dequeued for delivery/spawn
    completed: hooray           # 🎉 dispatch succeeded
    error: confused             # 😕 dispatch failed / worker crashed
  # Session announcement comment (issue-86): when a tmux-mode session is
  # spawned, post the tmux session name + `tmux attach -t …` on the work item
  # so a human can watch it work. A respawn posts nothing further (same name,
  # same command). Best-effort via your gh CLI; no-op for target-less
  # sessions, non-GitHub work items, or a missing gh. The body carries no
  # paths, session ids or hostnames.
  announce:
    enabled: true

# Standing sessions (issue-277): the sessions the-loop keeps for ITSELF —
# no ticket, no spec chain, no completion, started by `the-loop start` and
# addressed by name on the control plane or in a Slack thread of their own.
# Declared off here: this repository's checkout is where the-loop is BUILT, and
# a supervisor session belongs to the machine that RUNS it. An operator running
# the-loop from this checkout turns it on and declares their own entries — the
# shipped template (skills/the-loop/templates/cli-config.yaml) carries a
# commented one. Reviewing an entry is reviewing code: it names harness
# arguments and a working directory, and the session runs with the operator's
# own credentials.
standingSessions:
  enabled: false
  sessions: []

polling:
  intervalSeconds: 60
  maxRetries: 3                     # per-event delivery attempts before giving up (issue-80): a failing spawn/comment is retried each cycle up to this many times, then logged (poll.*_failed) and ignored until new activity re-arms it
  sources: []                       # empty = nothing polled; this repo dogfoods webhooks, not poll

# The control-plane API service (issue-161) — the HTTP layer the CLI, the MCP
# endpoint and the web dashboard all go through. Binding is left at its
# loopback default; only the cross-origin block is stated, because it is the
# one an operator is likely to want to change.
service:
  # Which browser ORIGINS may READ this service's responses (issue-211,
  # decision-077). Not a network setting: `host`/`exposed` decide who may
  # CONNECT, and nothing here widens that. The default entry is the origin
  # the-loop publishes its own dashboard to
  # (https://madarauchiha-314.github.io/the-loop/ui/), so the hosted page works
  # against a local service with no gateway in between — the cost being that
  # every Pages site under that same host shares the origin. Set
  # `allowOrigins: []` if you do not use the hosted dashboard.
  cors:
    allowOrigins: ["https://madarauchiha-314.github.io"]
    allowMethods: [GET, POST, OPTIONS]
    allowHeaders: [Accept, Content-Type]
    allowCredentials: false      # `true` with "*" above refuses to boot
    allowPrivateNetwork: true    # Chromium's public-page → loopback preflight

eventLog:                           # structured JSONL o11y trail; `the-loop events`
  enabled: true
  path: .the-loop/logs/events.jsonl

# Self-diagnosis (issue-242): when the-loop's OWN machinery fails (error-level
# events, terminal give-ups in the event log), debug the failure in an isolated
# agent one-shot and file the findings on the-loop's repo, labeled
# `the-loop: self-diagnosed`. STRICTLY OPT-IN, default off — enabling it means
# this machine may post redacted failure reports publicly with your gh
# credentials. Everything posted is allow-listed + scrubbed, and a self-filed
# issue is never armed (no auto-execute label, no control keyword, self-authored
# marker). Preview with `the-loop diagnose --dry-run` before flipping it on.
selfDiagnosis:
  enabled: false
  # repo: MadaraUchiha-314/the-loop        # where the issues are filed
  # label: "the-loop: self-diagnosed"
  # harness: claude                        # claude | cursor — runs the diagnosis one-shot
  # model: ""
  # timeoutSeconds: 900
  # intervalSeconds: 3600                  # watcher cadence inside the poller/gh-webhook daemons
  # maxIssuesPerDay: 3                     # rolling cap; excess candidates defer, never drop
  # maxRetries: 3                          # failed attempts per fingerprint before abandoning

# How the-loop's OWN calls reach external services (issue-109, decision-042).
# This governs the CONTROL PLANE only: what the AGENT does from inside its
# session is unconstrained — CLI, MCP, API, whatever the harness has.
#
# `auto` resolves in a documented order (a configured token, then an installed
# binary) and fails closed naming BOTH remedies. An explicit transport is
# honoured verbatim and fails rather than silently degrading, because a
# configured choice that quietly falls back is worse than an error.
integrations:
  github:
    transport: auto             # auto | api | cli
    # Which GitHub the-loop is on (issue-311): set your GitHub Enterprise domain
    # and every link it posts and every `gh` call it makes name that host. Unset,
    # it resolves from `api.baseUrl` (an enterprise base), then `$GH_HOST`, then
    # the checkout's origin remote (in-session), then github.com.
    # host: ghe.corp.example
    api:
      tokenEnv: [GH_TOKEN, GITHUB_TOKEN]
      baseUrl: https://api.github.com
    cli:
      binary: gh                # inherits your `gh auth`, incl. enterprise/SSO
  # There is deliberately no `slack` here any more (issue-245, PR #267 review):
  # the incoming webhook converged into `channels.slack` below, and
  # `the-loop migrate-config` retires an old section.

# Channels (issue-245, issue-309) — every channel is a peer on ONE event bus:
# it SUBSCRIBES to the event types it wants and may PUBLISH the ones it is
# granted, and one channel is the LEDGER every event is recorded on before
# anything acts on it (decision-103). GitHub is the only ledger this release
# ships. The Slack bot is opt-in, default off: when enabled, the ask, the
# graph's notifications and the ledger's comment events reach it through the
# bus filtered by `subscribe`; what an authorized member's message may become
# is `publish` — session input by default, a gate answer / a control keyword /
# a new work item by grant, each recorded on the ledger first and judged by the
# ledger's own ingress. Reads happen with polling (the daemons, or `the-loop
# channels poll`) or without (Socket Mode via `the-loop channels listen`).
channels:
  ledger: github
  slack:
    enabled: false
    # botTokenEnv: THE_LOOP_SLACK_BOT_TOKEN  # xoxb-, chat:write + channels.history
    # appTokenEnv: THE_LOOP_SLACK_APP_TOKEN  # xapp-, only for read.mode: socket
    # channel: ""                            # the channel id the bot posts into (C…)
    # subscribe: [session.awaiting_input]    # what this channel RECEIVES
    # publish: [work-item.reply]             # what a message here MAY BECOME
    #                                        # (+ gate.feedback, control.command, work-item.create)
    # verbosity: normal                      # quiet | normal | verbose
    # maxChars: 1500
    # kickoff:                               # only with the work-item.create grant
    #   repo: ""                             # owner/repo; empty = off
    #   labels: []
    # read:
    #   mode: poll                           # poll | socket | off
    #   intervalSeconds: 30
